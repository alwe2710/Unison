# XcodeGen spec (https://github.com/yonaskolb/XcodeGen) -- this repo commits
# no .xcodeproj (binary-ish, unreviewable diffs); CI (and any local macOS
# dev) runs `xcodegen generate` from this file first, same reasoning as
# clients/switch's CMakeLists.txt not committing a generated build/. See
# this directory's README for why iOS specifically needs a real macOS
# runner (Xcode/SwiftUI don't exist on Linux, unlike every other client's
# devkitPro/emsdk toolchain).
name: Unison
options:
  bundleIdPrefix: com.unison
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

targets:
  Unison:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Vendored unison_core, compiled straight from the repo root's
      # core/ -- same "no copy, add_subdirectory()-able" reasoning as
      # clients/android's CMakeLists.txt (see that file's own comment);
      # XcodeGen's `sources:` happily points outside clients/ios like
      # CMake's add_subdirectory() does, no local copy/symlink needed.
      - path: ../../core/src
        group: UnisonCore/src
      - path: ../../core/third_party/miniz
        group: UnisonCore/third_party/miniz
      - path: ../../core/third_party/teeny-sha1
        group: UnisonCore/third_party/teeny-sha1
    resources:
      - path: Sources/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unison.ios
        # Sources/Resources/Assets.xcassets/AppIcon.appiconset -- a single
        # 1024x1024 "universal" icon (modern Xcode/iOS 17+ format, one
        # image covers iPhone/iPad/App Store, no per-idiom size list
        # needed), generated from assets/logo/unison-logo.png (already
        # exactly 1024x1024 RGB with no alpha channel -- App Store
        # validation rejects an app icon that has one). Without this
        # setting naming the icon set, Xcode has no way to know
        # AppIcon.appiconset (vs. any other asset in the catalog) is
        # *the* app icon -- the app installed with no icon at all until
        # this was added.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Must exactly match docs/altstore/apps.json's versions[0].version --
        # AltStore rejects a downloaded .ipa whose actual
        # CFBundleShortVersionString (Info.plist's $(MARKETING_VERSION)
        # substitution, see Sources/Info.plist) doesn't byte-for-byte match
        # what the source declared. "-dev" marks this as the rolling
        # ios-latest build, distinct from any future tagged stable release.
        # Bump this (and CURRENT_PROJECT_VERSION below) whenever this
        # rolling build changes -- AltStore/SideStore only offer an update
        # when the version/buildVersion strings actually differ from what
        # a device already has installed, not from apps.json's size/date
        # alone (see docs/altstore/README.md's own note on this).
        MARKETING_VERSION: "0.2.0-dev"
        CURRENT_PROJECT_VERSION: "4"
        SWIFT_VERSION: "5.0"
        # No code signing -- CI only ever builds for the Simulator
        # (see .github/workflows/build.yml's `ios` job), which needs no
        # certificate/provisioning profile at all. A real device/App
        # Store build needs a Developer account and isn't set up here.
        CODE_SIGNING_ALLOWED: "NO"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "Unison"
        # iPhone + iPad (Android has no such split -- a single
        # android:orientation-less manifest covers both phone and tablet
        # there). All four orientations declared as *possible* here;
        # OrientationLock.swift (AppDelegate hook) restricts which are
        # *active* per screen at runtime -- PlayerView locks to landscape
        # (matches Android's PlayerActivity forcing landscape), every
        # other screen (Menu/Settings/...) follows the device's actual
        # orientation, unlike the previous app-wide landscape-only lock
        # (fine on an iPhone held sideways to play, but forced every menu/
        # settings screen sideways too, which reads badly, worse still on
        # an iPad someone would naturally hold upright to navigate menus).
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../../core/include"
          - "$(SRCROOT)/../../core/third_party/miniz"
          - "$(SRCROOT)/../../core/third_party/teeny-sha1"
        # unison_native_bridge.h (plain C, see Sources/Native/) exposed to
        # Swift via a bridging header -- Swift's normal C-interop story,
        # no JNI-equivalent glue needed (see clients/ios/README.md).
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Native/Unison-Bridging-Header.h
    info:
      path: Sources/Info.plist
      properties:
        # XcodeGen (re)generates Sources/Info.plist from this properties:
        # dict on every `xcodegen generate` -- the file at `path` is
        # write-target, not a static source it merges into (a hand-edit to
        # the committed file alone had no effect: CI's built .ipa still
        # reported CFBundleShortVersionString "1.0"). These two keys must
        # live here for real, same $(MARKETING_VERSION)/
        # $(CURRENT_PROJECT_VERSION) substitution syntax as any Xcode
        # project -- resolved against this target's own build settings
        # above at build time.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, de, fr, it, es]
        CFBundleDevelopmentRegion: en
        ITSAppUsesNonExemptEncryption: false
        # LobbyModel's GET /status probe (GC_GBA_LINK's P1-P4 picker) is
        # plain HTTP to a private-network IP, not HTTPS -- ATS blocks that
        # by default. NSAllowsLocalNetworking (iOS 10+) permits HTTP
        # specifically to local-network hosts (private IP ranges, .local
        # domains) without needing the much broader NSAllowsArbitraryLoads.
        # GbaStreamClient's own WebSocket handshake connection is
        # unaffected either way -- it's raw POSIX sockets, not URLSession/
        # NSURLConnection, and ATS only ever applies to those.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Not strictly required for a plain unicast GET to an IP the user
        # entered themselves (that permission specifically gates mDNS/
        # Bonjour discovery and LAN broadcast/multicast, which is what
        # BeaconListener's UDP receive arguably *does* trigger on a real
        # device, unlike the Simulator) -- included anyway since it costs
        # nothing and is the right thing to have declared regardless.
        NSLocalNetworkUsageDescription: "Unison discovers and connects to emulator hosts on your local network."

  UnisonTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/UnisonTests
    settings:
      base:
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../../core/include"
          - "$(SRCROOT)/../../core/third_party/miniz"
          - "$(SRCROOT)/../../core/third_party/teeny-sha1"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Native/Unison-Bridging-Header.h
    dependencies:
      - target: Unison

  UnisonUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        TEST_TARGET_NAME: Unison

schemes:
  Unison:
    build:
      targets:
        Unison: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - UnisonTests
        - UnisonUITests
