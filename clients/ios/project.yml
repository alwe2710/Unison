# XcodeGen spec (https://github.com/yonaskolb/XcodeGen) -- this repo commits
# no .xcodeproj (binary-ish, unreviewable diffs); CI (and any local macOS
# dev) runs `xcodegen generate` from this file first, same reasoning as
# clients/switch's CMakeLists.txt not committing a generated build/. See
# this directory's README for why iOS specifically needs a real macOS
# runner (Xcode/SwiftUI don't exist on Linux, unlike every other client's
# devkitPro/emsdk toolchain).
name: Unison
options:
  bundleIdPrefix: com.unison
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

targets:
  Unison:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Sources/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unison.ios
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        # No code signing -- CI only ever builds for the Simulator
        # (see .github/workflows/build.yml's `ios` job), which needs no
        # certificate/provisioning profile at all. A real device/App
        # Store build needs a Developer account and isn't set up here.
        CODE_SIGNING_ALLOWED: "NO"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "Unison"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # PlayerView locks to landscape (matches Android's PlayerActivity
        # forcing landscape -- see that Activity's own manifest entry);
        # every other screen is happy to inherit this too, same as Android
        # not special-casing orientation per-Activity either.
    info:
      path: Sources/Info.plist
      properties:
        CFBundleLocalizations: [en, de, fr, it, es]
        CFBundleDevelopmentRegion: en
        ITSAppUsesNonExemptEncryption: false

  UnisonTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/UnisonTests
    settings:
      base:
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
    dependencies:
      - target: Unison

schemes:
  Unison:
    build:
      targets:
        Unison: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - UnisonTests
