<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Unison Web Client</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  :root{
    --bg:#241b2f;--surface:#33253f;--surface-2:#3e2d4d;
    --ink:#f7eefc;--muted:#b79fc7;--accent:#7c5cff;--accent-ink:#fbfaff;
    --ok:#7be0b0;--radius:14px;
    --font-display:"Trebuchet MS","Century Gothic",system-ui,sans-serif;
    --font-body:system-ui,"Segoe UI",sans-serif;
    --border:1px solid rgba(255,255,255,0.12);
  }
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);
            height:100%;display:flex;flex-direction:column;align-items:center;
            justify-content:center;overscroll-behavior:none}

  /* The video always fills as much of the browser window as the stream's
     aspect ratio allows (desktop: JS sizes the canvas element itself so
     #videoWrap -- and therefore the gear button pinned to its corner --
     shrink-wraps to exactly the visible image, not the letterboxed
     viewport; mobile: plain object-fit:contain, no JS sizing needed since
     its overlay controls intentionally span the whole screen instead of
     hugging the image). */
  #game{display:none;position:fixed;inset:0;width:100vw;height:100vh;background:#000;
        align-items:center;justify-content:center}
  #status{position:absolute;top:8px;left:8px;margin:0;z-index:5;font-size:11px;
          color:var(--ink);background:rgba(0,0,0,0.4);padding:2px 8px;border-radius:20px}
  #videoWrap{position:relative;line-height:0}
  /* touch-action:none -- without it, a touch-drag on the canvas (real
     touch input, see the pointerdown/pointermove listeners below) also
     scrolls/pinch-zooms the page underneath it, same as any other
     touch-driven control surface needs. */
  canvas{image-rendering:pixelated;display:block;border:var(--border);border-radius:12px;touch-action:none}

  /* ---------- Connect / lobby: rounded "cartridge" tiles joined by a thin
     link-cable line, referencing the physical GC-GBA link cable this
     started out emulating -- kept for the (still common) multi-slot
     GC_GBA_LINK picker; the connect form below reuses the same look.
     Fullscreen flex column: the heading sits near the top, and the content
     takes up the remaining space and centers itself within it, rather than
     the two being centered together as one block. ---------- */
  #connect,#lobby{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
         text-align:center;padding:24px 20px;padding-top:max(72px, env(safe-area-inset-top));
         box-sizing:border-box;overflow-y:auto}
  #lobby{display:none}
  .brand{flex-shrink:0}
  .brand .mark{font-family:var(--font-display);font-weight:700;font-size:13px;
                      letter-spacing:0.08em;text-transform:uppercase;color:var(--accent)}
  .brand h1{font-family:var(--font-display);margin:6px 0 0;font-size:24px;
                  letter-spacing:-0.01em;text-wrap:balance}
  .brand p{margin:8px 0 0;font-size:13.5px;color:var(--muted)}
  #lobbyButtons{display:flex;flex-direction:column;flex:1;justify-content:center;
                width:100%;max-width:420px;text-align:left}
  /* Mobile: stretch to (near) the full screen width instead of the
     desktop's comfortably-capped column. */
  body.mobile #connect,body.mobile #lobby{padding-left:16px;padding-right:16px}
  body.mobile #lobbyButtons,body.mobile #connectForm{max-width:none}

  #connectForm{display:flex;flex-direction:column;flex:1;justify-content:center;
               width:100%;max-width:340px;gap:12px}
  #connectForm label{display:flex;flex-direction:column;gap:6px;text-align:left;
                      font-size:12px;color:var(--muted);text-transform:uppercase;
                      letter-spacing:0.05em;font-weight:600}
  #connectForm input{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);
                      border:var(--border);border-radius:var(--radius);padding:11px 14px;
                      box-sizing:border-box;width:100%}
  #connectForm input:focus{outline:2px solid var(--accent);outline-offset:1px}
  #connectForm .row{display:flex;gap:10px}
  #connectForm .row label:last-child{flex:0 0 108px}
  #connectForm button{margin-top:6px;font-family:var(--font-display);font-weight:700;
                       font-size:14px;border:none;cursor:pointer;padding:13px;
                       border-radius:var(--radius);background:var(--accent);color:var(--accent-ink)}
  #connectForm button:disabled{opacity:0.6;cursor:default}
  /* Secondary action, not the primary "Verbinden" -- outline instead of
     filled, so it doesn't visually compete with the actual submit button
     right below it. */
  #probePortsBtn{margin-top:-2px;background:transparent;border:var(--border);
                 color:var(--ink)}
  #probeStatus{color:var(--muted);font-size:12.5px;min-height:1.2em;margin:0}
  #connectError{color:#ff9a9a;font-size:12.5px;min-height:1.2em}

  .slot{display:flex;align-items:center;gap:12px;width:100%;font:inherit;color:var(--ink);
        text-align:left;cursor:pointer;background:var(--surface);border:var(--border);
        border-radius:var(--radius);padding:12px 16px;margin:0 0 10px;position:relative}
  .slot:not(:last-child)::after{content:"";position:absolute;left:31px;bottom:-10px;
                                width:2px;height:10px;
                                background:linear-gradient(var(--accent),transparent)}
  .slot .tag{width:38px;height:38px;border-radius:12px;flex-shrink:0;display:flex;
            align-items:center;justify-content:center;font-family:var(--font-display);
            font-weight:700;font-size:14px;background:var(--accent);color:var(--accent-ink)}
  .slot:disabled .tag{background:var(--surface-2);color:var(--muted)}
  .slot .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .slot .name{font-size:14px;font-weight:600}
  .slot .sub{font-size:11.5px;color:var(--muted)}
  .slot .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex-shrink:0}
  .slot:disabled .dot{background:var(--muted)}
  .slot:disabled{cursor:not-allowed;opacity:0.7}

  /* Mobile: the D-pad/buttons overlay is drawn on top of the video like a
     typical mobile emulator and intentionally spans the whole screen
     (rather than hugging the image like the desktop gear button does), so
     #videoWrap just needs to fill #game and let object-fit do the letterbox
     -- no JS sizing needed, unlike desktop. */
  body.mobile{overflow:hidden}
  body.mobile #videoWrap{width:100%;height:100%}
  body.mobile canvas{width:100%;height:100%;object-fit:contain;border:none;border-radius:0}

  /* Absolutely positioned within the fixed full-viewport container, laid out
     like a typical mobile emulator: shoulder buttons in the top corners,
     D-pad bottom-left, Select/Start (small) stacked above the big A/B
     buttons bottom-right -- keeps the bottom-right cluster narrow enough to
     never overflow off-screen on narrow phones, unlike a single wide row. */
  #touchControls{position:fixed;inset:0;display:none;pointer-events:none;z-index:10}
  .tshoulder{position:absolute;top:14px;width:52px;height:36px;font-size:13px}
  #touchL{left:14px}
  #touchR{right:14px}
  #touchDpad{position:absolute;left:20px;bottom:24px;
             display:grid;grid-template-columns:repeat(3, 48px);grid-template-rows:repeat(3, 48px);
             grid-template-areas:". u ." "l . r" ". d ."}
  #touchRight{position:absolute;right:20px;bottom:24px;
              display:flex;flex-direction:column;align-items:flex-end;gap:12px}
  #touchStartSelect{display:flex;gap:8px}
  /* A (last child) sits higher than B, like the real GBA's staggered layout. */
  #touchAB{display:flex;align-items:flex-end;gap:10px}
  #touchAB button:last-child{margin-bottom:20px}
  .tbtn{font-family:var(--font-display);font-weight:600;font-size:15px;border-radius:var(--radius);
        border:var(--border);background:var(--surface);color:var(--ink);user-select:none;
        -webkit-user-select:none;touch-action:none;pointer-events:auto}
  .tbtn.round{border-radius:50%;width:48px;height:48px}
  .tbtn.big{width:60px;height:60px;font-size:19px}
  .tbtn.small{width:44px;height:30px;font-size:10.5px;border-radius:999px}
  /* Darkened while held, so a press is visually obvious with no haptic
     feedback to rely on. */
  .tbtn.pressed{background:var(--surface-2)}
  /* A is the primary action, so it alone carries the accent -- a soft glow
     rather than the flat swap the other buttons get when pressed. */
  [data-name="A"].tbtn{background:var(--accent);color:var(--accent-ink);border-color:transparent;
                        box-shadow:0 0 0 5px rgba(124,92,255,0.25)}
  [data-name="A"].tbtn.pressed{box-shadow:0 0 0 3px rgba(124,92,255,0.4)}

  #menuButton{display:none;position:fixed;top:14px;left:50%;transform:translateX(-50%);
              width:44px;height:44px;border-radius:50%;background:rgba(20,15,26,0.7);
              color:var(--ink);border:var(--border);font-size:18px;
              padding:0;z-index:20;align-items:center;justify-content:center}
  /* justify-content:flex-start (not center) so a panel taller than the
     viewport in landscape scrolls from the top instead of centering and
     clipping its first item above the visible area. */
  #menuPanel{display:none;position:fixed;inset:0;background:rgba(20,15,26,0.94);color:var(--ink);
             font-family:var(--font-body);z-index:30;flex-direction:column;align-items:center;
             justify-content:flex-start;gap:10px;padding:20px 18px;
             padding-top:max(20px, env(safe-area-inset-top));
             box-sizing:border-box;overflow-y:auto;text-align:center}
  #menuPanel h3{font-family:var(--font-display);margin:4px 0 4px;font-size:18px}
  /* Live latency/frame-rate readout, shown above the button-mapping UI on
     both desktop (settings gear) and mobile (hamburger menu) so a player who
     notices lag has an immediate way to tell network latency (ping) apart
     from a rendering/decode issue (frame rate) without leaving the page. */
  .stats-row{display:flex;gap:18px;font-size:12.5px;color:var(--muted);margin:2px 0 6px}
  .stats-row b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:700}
  .menu-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;
              margin-top:8px}
  .menu-row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
            max-width:320px;background:var(--surface);border:var(--border);
            border-radius:var(--radius);padding:10px 14px;font-size:13px;box-sizing:border-box;
            cursor:default}
  #gamepadBindingsList{display:flex;flex-direction:column;gap:8px;width:100%;align-items:center}
  #gamepadBindingsList .hint{font-size:12px;color:var(--muted);max-width:280px}
  .filter-rows{display:flex;flex-direction:column;gap:8px;width:100%;align-items:center}
  .pill{font-family:var(--font-body);font-size:11.5px;font-weight:700;border:none;cursor:pointer;
        padding:7px 14px;border-radius:999px;background:var(--accent);color:var(--accent-ink)}
  /* .menu-row is normally a plain non-interactive div (cursor:default) --
     .nav-row overrides that plus resets the <button> defaults it's applied
     to, for the one row here that navigates (opens #languagePanel) instead
     of just displaying state, matching Android's Settings row pattern:
     label left, current value right, whole row tappable. */
  .nav-row{cursor:pointer;font:inherit;color:inherit}
  .nav-row-value{color:var(--muted);font-size:12px}
  /* #keyBindingsPanel/#bilinearPanel join this same shared-overlay rule --
     both are new sub-panels opened from #settingsPanel/#menuPanel's nav rows
     the same way #languagePanel/#videoModePanel already were (see those two
     panels' own JS wiring, openLanguagePanel()/openVideoModePanel(), and the
     analogous openKeyBindingsPanel()/openBilinearPanel() below it). overflow-y
     auto here (new) since #keyBindingsPanel in particular can now get taller
     than the viewport once both the keyboard table and the gamepad list live
     in it together -- language/video-mode's own short lists never needed it,
     but it's harmless for those too. */
  #languagePanel,#videoModePanel,#keyBindingsPanel,#bilinearPanel{
                 display:none;position:fixed;inset:0;background:rgba(20,15,26,0.94);
                 color:var(--ink);font-family:var(--font-body);z-index:40;flex-direction:column;
                 align-items:center;justify-content:center;gap:10px;padding:20px;box-sizing:border-box;
                 overflow-y:auto}
  #languagePanel h3,#videoModePanel h3,#keyBindingsPanel h3,#bilinearPanel h3{
                 font-family:var(--font-display);margin:0 0 4px;font-size:18px}
  .language-list{display:flex;flex-direction:column;gap:8px;width:100%;max-width:320px}
  .language-list button{font:inherit;font-size:14px;color:var(--ink);text-align:left;cursor:pointer;
                        background:var(--surface);border:var(--border);border-radius:var(--radius);
                        padding:12px 16px}
  /* Non-blocking heads-up when the server fell back to a different mode
     than requested (docs/protocol.md "Video-mode fallback") -- the video
     underneath is already live, unlike #languagePanel/#videoModePanel this
     sits *above* #game, not one of the panels that replace it. */
  #videoModeFallbackPanel{display:none;position:fixed;inset:0;background:rgba(20,15,26,0.85);
                 color:var(--ink);font-family:var(--font-body);z-index:50;flex-direction:column;
                 align-items:center;justify-content:center;gap:10px;padding:20px;box-sizing:border-box}
  #videoModeFallbackPanel .card{background:var(--surface);border:var(--border);border-radius:var(--radius);
                 padding:20px;max-width:340px;display:flex;flex-direction:column;gap:10px}
  #videoModeFallbackPanel h3{font-family:var(--font-display);margin:0;font-size:17px}
  #videoModeFallbackPanel .row{display:flex;gap:8px;justify-content:flex-end}
  #videoModeFallbackPanel button{font:inherit;font-size:13px;font-weight:600;cursor:pointer;
                 background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;
                 padding:9px 16px}
  #videoModeFallbackPanel button.secondary{background:transparent;color:var(--muted);border:var(--border)}
  input.switch{appearance:none;-webkit-appearance:none;width:34px;height:20px;border-radius:999px;
               background:var(--surface-2);position:relative;cursor:pointer;margin:0;
               flex-shrink:0}
  input.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;
                      border-radius:50%;background:var(--muted)}
  input.switch:checked::after{left:16px;background:var(--accent)}
  /* #closeKeyBindings/#closeBilinear (new) reuse this same look -- visually
     they're the identical "muted pill at the bottom" whether the label ends
     up being "Schließen" (top-level panels, back to the game) or "Zurück"
     (these two sub-panels, back to whichever of #settingsPanel/#menuPanel
     opened them -- see openKeyBindingsPanel()/openBilinearPanel()). */
  #closeMenu,#closeKeyBindings,#closeBilinear{margin-top:10px;background:transparent;border:var(--border);
             color:var(--muted);font-family:var(--font-body);font-size:12.5px;font-weight:600;
             padding:9px 20px;border-radius:999px;cursor:pointer}

  /* ---------- Desktop keyboard-rebind: a gear button bottom-right opens a
     table of button->key assignments, mirroring the mobile hamburger menu's
     role but as a table since there's no touch overlay to keep in view. ---------- */
  /* Positioned absolute within #videoWrap (not fixed to the viewport) so it
     sits right on the corner of the visible image itself, letterboxing or
     not. */
  #settingsButton{display:none;position:absolute;right:8px;bottom:8px;
                  width:42px;height:42px;border-radius:50%;background:var(--surface);
                  color:var(--ink);border:var(--border);font-size:18px;
                  padding:0;z-index:20;align-items:center;justify-content:center;cursor:pointer}
  body.mobile #settingsButton{display:none !important}
  #settingsPanel{display:none;position:fixed;inset:0;background:rgba(20,15,26,0.85);
                 color:var(--ink);font-family:var(--font-body);z-index:30;
                 flex-direction:column;align-items:center;justify-content:center;
                 gap:14px;padding:20px;box-sizing:border-box}
  #settingsPanel h3{font-family:var(--font-display);margin:0;font-size:19px}
  #settingsTable{border-collapse:collapse;background:var(--surface);border:var(--border);
                 border-radius:var(--radius);overflow:hidden;font-size:13.5px}
  #settingsTable th,#settingsTable td{padding:9px 16px;text-align:left}
  #settingsTable th{color:var(--muted);font-size:11px;text-transform:uppercase;
                    letter-spacing:0.05em;font-weight:600;border-bottom:var(--border)}
  #settingsTable tr:not(:last-child) td{border-bottom:1px solid rgba(255,255,255,0.06)}
  #settingsTable td:first-child{font-weight:600}
  #settingsTable td:nth-child(2){color:var(--muted);font-variant-numeric:tabular-nums}
  #settingsTable button{font-family:var(--font-body);font-size:11.5px;font-weight:700;
                        border:none;cursor:pointer;padding:6px 12px;border-radius:999px;
                        background:var(--accent);color:var(--accent-ink)}
  #closeSettings{background:transparent;border:var(--border);color:var(--muted);
                 font-family:var(--font-body);font-size:12.5px;font-weight:600;
                 padding:9px 20px;border-radius:999px;cursor:pointer}
</style></head>
<body>
<div id="connect">
  <div class="brand">
    <div class="mark">unison</div>
    <h1>Mit Server verbinden</h1>
    <p id="connectStatus">IP-Adresse des Emulators eingeben</p>
  </div>
  <form id="connectForm">
    <label>Host
      <input id="hostInput" type="text" placeholder="192.168.1.42" autocomplete="off"
             autocapitalize="off" spellcheck="false" required>
    </label>
    <div class="row">
      <label>Port
        <input id="portInput" type="number" min="1" max="65535" value="6800" required>
      </label>
    </div>
    <button type="button" id="probePortsBtn">Port automatisch finden</button>
    <p id="probeStatus"></p>
    <button type="submit" id="connectSubmit">Verbinden</button>
    <div id="connectError"></div>
  </form>
</div>
<div id="lobby">
  <div class="brand">
    <div class="mark">Link Cable</div>
    <h1>Wer spielt mit?</h1>
    <p id="lobbyStatus">Slot wählen...</p>
  </div>
  <div id="lobbyButtons"></div>
</div>
<div id="game">
<div id="status">connecting...</div>
<div id="videoWrap">
  <canvas id="screen" width="240" height="160"></canvas>
  <button id="settingsButton" title="Tastenbelegung">&#9881;</button>
</div>
<div id="settingsPanel">
  <h3 id="settingsPanelTitle">Einstellungen</h3>
  <div class="stats-row">
    <span>Ping: <b id="statPing">--</b> ms</span>
    <span>Bildrate: <b id="statFps">--</b> fps</span>
  </div>
  <button class="menu-row nav-row" id="keyBindingsRowDesktop">
    <span id="keyBindingsLabelDesktop"></span>
  </button>
  <button class="menu-row nav-row" id="bilinearRowDesktop">
    <span id="bilinearLabelDesktop"></span>
  </button>
  <button class="menu-row nav-row" id="languageRowDesktop">
    <span>Sprache</span>
    <span id="languageValueDesktop" class="nav-row-value"></span>
  </button>
  <button class="menu-row nav-row" id="videoModeRowDesktop">
    <span id="videoModeLabelDesktop"></span>
    <span id="videoModeValueDesktop" class="nav-row-value"></span>
  </button>
  <button id="closeSettings">Schließen</button>
</div>
<div id="languagePanel">
  <h3 id="languagePanelTitle">Sprache</h3>
  <div id="languageOptionsList" class="language-list"></div>
</div>
<div id="videoModePanel">
  <h3 id="videoModePanelTitle"></h3>
  <div id="videoModeOptionsList" class="language-list"></div>
</div>
<!-- New nested sub-panels (mirroring Android's SettingsActivity, whose
     Tastenzuweisungen/Bilineare-Filterung rows each push their own full
     screen instead of showing inline content) -- opened from a nav row on
     either #settingsPanel (desktop) or #menuPanel (mobile) via the same
     returnPanel-parameterized open*Panel() pattern #languagePanel/
     #videoModePanel already use, see the JS below. Unlike those two, there's
     no single "tap an option, done" action here, so each gets its own
     explicit back button instead of returning automatically. -->
<div id="keyBindingsPanel">
  <h3 id="keyBindingsPanelTitle"></h3>
  <table id="settingsTable">
    <thead><tr><th>Taste</th><th>Belegung</th><th></th></tr></thead>
    <tbody id="settingsTableBody"></tbody>
  </table>
  <div class="menu-label" id="gamepadSectionLabel"></div>
  <div id="gamepadBindingsList"></div>
  <button id="closeKeyBindings"></button>
</div>
<div id="bilinearPanel">
  <h3 id="bilinearPanelTitle"></h3>
  <div id="filterRows" class="filter-rows"></div>
  <button id="closeBilinear"></button>
</div>
<div id="videoModeFallbackPanel">
  <div class="card">
    <h3 id="videoModeFallbackTitle"></h3>
    <div id="videoModeFallbackMessage"></div>
    <div class="row">
      <button class="secondary" id="videoModeFallbackAbort"></button>
      <button id="videoModeFallbackContinue"></button>
    </div>
  </div>
</div>
<div id="touchControls">
  <button class="tbtn tshoulder" id="touchL" data-name="L">L</button>
  <button class="tbtn tshoulder" id="touchR" data-name="R">R</button>
  <div id="touchDpad">
    <button class="tbtn" data-name="Up" style="grid-area:u">▲</button>
    <button class="tbtn" data-name="Left" style="grid-area:l">◀︎</button>
    <button class="tbtn" data-name="Right" style="grid-area:r">▶︎</button>
    <button class="tbtn" data-name="Down" style="grid-area:d">▼</button>
  </div>
  <div id="touchRight">
    <div id="touchStartSelect">
      <button class="tbtn small" data-name="Select">SEL</button>
      <button class="tbtn small" data-name="Start">STA</button>
    </div>
    <div id="touchAB">
      <button class="tbtn round big" data-name="B">B</button>
      <button class="tbtn round big" data-name="A">A</button>
    </div>
  </div>
</div>
<button id="menuButton">&#9776;</button>
<div id="menuPanel">
  <h3>Menü</h3>
  <div class="stats-row">
    <span>Ping: <b id="statPingMobile">--</b> ms</span>
    <span>Bildrate: <b id="statFpsMobile">--</b> fps</span>
  </div>
  <label class="menu-row" for="toggleOverlay">
    <span>Touch-Overlay anzeigen</span>
    <input type="checkbox" class="switch" id="toggleOverlay">
  </label>
  <button class="menu-row nav-row" id="keyBindingsRowMobile">
    <span id="keyBindingsLabelMobile"></span>
  </button>
  <button class="menu-row nav-row" id="bilinearRowMobile">
    <span id="bilinearLabelMobile"></span>
  </button>
  <button class="menu-row nav-row" id="languageRowMobile">
    <span>Sprache</span>
    <span id="languageValueMobile" class="nav-row-value"></span>
  </button>
  <button class="menu-row nav-row" id="videoModeRowMobile">
    <span id="videoModeLabelMobile"></span>
    <span id="videoModeValueMobile" class="nav-row-value"></span>
  </button>
  <button id="closeMenu">Schließen</button>
</div>
</div>
<script src="strings_generated.js"></script>
<script src="settings.js"></script>
<script src="keybindings.js"></script>
<script src="unison_core.js"></script>
<script>
// STRINGS (strings_generated.js, generated from the central i18n/strings.json
// -- see that file's own top comment) is now { de: {...}, en: {...}, ... },
// keyed by the same {0}/{1} placeholder syntax the source JSON uses; t()
// picks the current language and substitutes them at call time. args are
// stringified via template-literal coercion, same as any other JS string
// concatenation.
//
// SUPPORTED_LANGS: keep in sync with i18n/strings.json's language set.
// currentLang: 'system' (default) resolves to whichever of these the
// browser's own language matches, else 'en' -- same "English if
// undetermined/unsupported" policy as every other client -- overridable via
// the settings panel's language picker (persisted in localStorage).
// SUPPORTED_LANGS/resolvedLang/formatString: settings.js (pure, unit-tested
// there -- see settings_test.mjs).
let langPref = localStorage.getItem('unisonWebLanguage') || 'system';
let currentLang = resolvedLang(langPref, (navigator.language || '').toLowerCase().slice(0, 2));
function setLangPref(pref) {
  langPref = pref;
  localStorage.setItem('unisonWebLanguage', pref);
  currentLang = resolvedLang(langPref, (navigator.language || '').toLowerCase().slice(0, 2));
}
function t(key, ...args) {
  const text = (STRINGS[currentLang] && STRINGS[currentLang][key]) || STRINGS.en[key];
  return formatString(text, args);
}

// Any touch-capable device is treated as mobile: fullscreen video, on-screen
// overlay instead of the keyboard-rebind panel, and the hamburger menu for
// optional gamepad binding -- detected up front (not just once connected)
// so the connect/lobby screens themselves can also adapt their layout.
const isMobile = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
if (isMobile) document.body.classList.add('mobile');

// Kicked off now (in parallel with the connect form, not awaited here) so
// the WASM module -- unison_core, built from wasm_bridge.c + core/, see
// this directory's README -- is normally already instantiated by the time
// the user actually hits "Verbinden"; beginSession() awaits this promise
// itself regardless, so submitting before it resolves still works, just
// without the head start. UNISON_PROTOCOL_VERSION mirrors
// unison/handshake.h -- this is the one piece of protocol knowledge that
// has to be duplicated here rather than asked of the WASM module itself,
// since it's needed before any handshake message (which is what would
// otherwise report it) has been received.
const UNISON_PROTOCOL_VERSION = 2;
const wasmModulePromise = UnisonCore();

// Antialiasing (bilinear vs. nearest-neighbor canvas upscale), configured
// per stream_type rather than one global toggle -- GBA/DS pixel art and a
// Wii U GamePad's higher-effective-resolution render suit different
// filtering. KNOWN_STREAM_TYPES is docs/protocol.md's fixed set
// ("Stream-Typen"); a type not yet explicitly set falls back to
// defaultBilinearFor(): nearest for GC_GBA_LINK (native-resolution pixel
// art), bilinear for the other three (already-upscaled/higher-effective-
// resolution renders that read better smoothed).
const KNOWN_STREAM_TYPES = [
  ['GC_GBA_LINK', t('console_gc_gba_link')],
  ['WIIU_GAMEPAD', t('console_wiiu_gamepad')],
  ['N3DS_BOTTOM_SCREEN', t('console_n3ds_bottom_screen')],
  ['NDS_BOTTOM_SCREEN', t('console_nds_bottom_screen')],
];
// defaultBilinearFor/bilinearFor: settings.js (pure, unit-tested there --
// see settings_test.mjs).
const filterPrefs = JSON.parse(localStorage.getItem('unisonWebBilinearByStreamType') || '{}');
function setBilinearFor(streamType, value) {
  filterPrefs[streamType] = value;
  localStorage.setItem('unisonWebBilinearByStreamType', JSON.stringify(filterPrefs));
}
// Module scope (not beginSession-local): set from the most recent hello
// once connected, but also read by the settings/menu panels' filter row
// onchange handlers below, which exist (and are usable) before any
// connection -- toggling a row for the type that happens to be currently
// connected takes effect immediately; any other row just updates
// filterPrefs for next time.
let currentStreamType = '';
// Which of the three type=2 frame shapes sendKeys() must build -- see that
// function's own comment. Set alongside currentStreamType (same hello,
// same lifetime/redirect-hop reasoning).
let currentInputEncoding = 'gba_buttons';

const connectEl = document.getElementById('connect');
const connectStatusEl = document.getElementById('connectStatus');
const connectErrorEl = document.getElementById('connectError');
const connectForm = document.getElementById('connectForm');
const connectSubmitEl = document.getElementById('connectSubmit');
const hostInput = document.getElementById('hostInput');
const portInput = document.getElementById('portInput');
const lobbyEl = document.getElementById('lobby');
const lobbyStatusEl = document.getElementById('lobbyStatus');
const lobbyButtonsEl = document.getElementById('lobbyButtons');
const gameEl = document.getElementById('game');

// Prefills from ?host=&port= (bookmarkable/shareable links), falling back to
// the last successfully-used values -- neither is required, both are just a
// convenience for the common case of always connecting to the same server.
const params = new URLSearchParams(location.search);
hostInput.value = params.get('host') || localStorage.getItem('unisonLastHost') || '';
portInput.value = params.get('port') || localStorage.getItem('unisonLastPort') || '6800';

// Configured in advance (before ever connecting), same as the other
// clients' equivalent settings screens -- there's no "current" stream_type
// to key a row off before a hello has actually arrived, so every known
// type gets its own row here, applied automatically once a connection's
// hello reveals which one it actually is (see currentStreamType/
// canvas.style.imageRendering below).
function renderFilterRows(containerId) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  for (const [streamType, label] of KNOWN_STREAM_TYPES) {
    const row = document.createElement('label');
    row.className = 'menu-row';
    const span = document.createElement('span');
    span.textContent = label;
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.className = 'switch';
    input.checked = bilinearFor(streamType, filterPrefs);
    input.onchange = () => {
      setBilinearFor(streamType, input.checked);
      if (streamType === currentStreamType) {
        document.getElementById('screen').style.imageRendering = input.checked ? 'auto' : 'pixelated';
      }
    };
    row.appendChild(span);
    row.appendChild(input);
    container.appendChild(row);
  }
}
// Was two separate calls (filterRowsDesktop/filterRowsMobile) against two
// duplicated containers, one inline in each of #settingsPanel/#menuPanel --
// both now instead nav-row into the single shared #bilinearPanel below, so
// there's only ever one live #filterRows list to render.
renderFilterRows('filterRows');

// Own overlay (#languagePanel), opened from either settings panel's
// "Sprache"/"Language" row -- a plain list, not the previous inline
// System/Deutsch/English pills: tapping an option applies it immediately
// and returns straight to whichever panel opened this one, same
// "tap a row, pick from it, land back where you were" flow as every other
// client's language screen now uses.
const languagePanel = document.getElementById('languagePanel');
const languageOptionsList = document.getElementById('languageOptionsList');
let languageReturnPanel = null;

const LANGUAGE_OPTION_KEYS = {
  system: 'language_system', de: 'language_german', en: 'language_english',
  fr: 'language_french', it: 'language_italian', es: 'language_spanish',
};

function updateLanguageRowValues() {
  const key = LANGUAGE_OPTION_KEYS[langPref] || 'language_system';
  document.getElementById('languageValueDesktop').textContent = t(key);
  document.getElementById('languageValueMobile').textContent = t(key);
}

function renderLanguageOptions() {
  document.getElementById('languagePanelTitle').textContent = t('settings_language');
  languageOptionsList.innerHTML = '';
  // Sorted by the displayed label, not a fixed order -- "System" is
  // localized like any other UI string, but every language name itself is
  // a fixed endonym (see strings.json), so this only actually reorders
  // relative to "System"/"Système"/... as more languages are added later.
  const options = Object.entries(LANGUAGE_OPTION_KEYS)
      .sort((a, b) => t(a[1]).localeCompare(t(b[1])));
  for (const [pref, key] of options) {
    const btn = document.createElement('button');
    btn.textContent = t(key);
    btn.onclick = () => {
      setLangPref(pref);
      updateLanguageRowValues();
      languagePanel.style.display = 'none';
      if (languageReturnPanel) languageReturnPanel.style.display = 'flex';
    };
    languageOptionsList.appendChild(btn);
  }
}

function openLanguagePanel(returnPanel) {
  languageReturnPanel = returnPanel;
  returnPanel.style.display = 'none';
  renderLanguageOptions();
  languagePanel.style.display = 'flex';
}

document.getElementById('languageRowDesktop').onclick = () => openLanguagePanel(document.getElementById('settingsPanel'));
document.getElementById('languageRowMobile').onclick = () => openLanguagePanel(document.getElementById('menuPanel'));
updateLanguageRowValues();

// Own overlay (#videoModePanel), same "tap a row, pick from it, land back
// where you were" pattern as #languagePanel above -- see this file's own
// clone-of-the-language-picker comment there. Persisted in localStorage
// like every other client-local setting here (no server round-trip needed
// to know it, unlike Android's Prefs which is read fresh at connect() time
// but works out to the same thing).
const videoModePanel = document.getElementById('videoModePanel');
const videoModeOptionsList = document.getElementById('videoModeOptionsList');
let videoModeReturnPanel = null;

// NOT sorted alphabetically, unlike LANGUAGE_OPTION_KEYS above -- this order
// is deliberate (matches Android's Prefs.VIDEO_MODES: default first, then
// the two stronger/lossier compressed options, legacy last as the
// explicit-opt-out fallback), not something to "fix" into alphabetical.
const VIDEO_MODE_OPTION_KEYS = {
  tiles: 'video_mode_tiles', h264: 'video_mode_h264', h265: 'video_mode_h265', legacy: 'video_mode_legacy',
};
const VIDEO_MODE_DEFAULT = 'tiles';
let videoModePref = localStorage.getItem('unisonWebVideoMode') || VIDEO_MODE_DEFAULT;
function setVideoModePref(mode) {
  videoModePref = mode;
  localStorage.setItem('unisonWebVideoMode', mode);
}

function updateVideoModeRowValues() {
  document.getElementById('videoModeLabelDesktop').textContent = t('settings_video_mode');
  document.getElementById('videoModeLabelMobile').textContent = t('settings_video_mode');
  const key = VIDEO_MODE_OPTION_KEYS[videoModePref] || VIDEO_MODE_OPTION_KEYS[VIDEO_MODE_DEFAULT];
  document.getElementById('videoModeValueDesktop').textContent = t(key);
  document.getElementById('videoModeValueMobile').textContent = t(key);
}

function renderVideoModeOptions() {
  document.getElementById('videoModePanelTitle').textContent = t('settings_video_mode');
  videoModeOptionsList.innerHTML = '';
  for (const [mode, key] of Object.entries(VIDEO_MODE_OPTION_KEYS)) {
    const btn = document.createElement('button');
    btn.textContent = t(key);
    btn.onclick = () => {
      setVideoModePref(mode);
      updateVideoModeRowValues();
      videoModePanel.style.display = 'none';
      if (videoModeReturnPanel) videoModeReturnPanel.style.display = 'flex';
    };
    videoModeOptionsList.appendChild(btn);
  }
}

function openVideoModePanel(returnPanel) {
  videoModeReturnPanel = returnPanel;
  returnPanel.style.display = 'none';
  renderVideoModeOptions();
  videoModePanel.style.display = 'flex';
}

document.getElementById('videoModeRowDesktop').onclick = () => openVideoModePanel(document.getElementById('settingsPanel'));
document.getElementById('videoModeRowMobile').onclick = () => openVideoModePanel(document.getElementById('menuPanel'));
updateVideoModeRowValues();

// #keyBindingsPanel's/#bilinearPanel's own row-label text (e.g. "Tastenzuweisungen")
// is set here, unconditionally, same as language/video-mode's rows just
// above -- it's static per-language text, no connection needed to know it.
// The panels' actual open/close wiring, though, lives inside beginSession()
// further down (not here) -- unlike #languagePanel/#videoModePanel,
// opening #keyBindingsPanel calls renderSettings()/renderGamepadBindingsList(),
// both of which are only meaningful (and only defined) once a session is
// live, same reason the old inline settingsTable/gamepadBindingsList
// rendering always lived inside beginSession() too.
function updateKeyBindingsRowValues() {
  const label = t('settings_key_bindings');
  document.getElementById('keyBindingsLabelDesktop').textContent = label;
  document.getElementById('keyBindingsLabelMobile').textContent = label;
}
updateKeyBindingsRowValues();

function updateBilinearRowValues() {
  const label = t('settings_antialiasing');
  document.getElementById('bilinearLabelDesktop').textContent = label;
  document.getElementById('bilinearLabelMobile').textContent = label;
}
updateBilinearRowValues();

// This client's own real answer to "no discovery beacon" (README.md's own
// section on it) -- a browser has no way to receive the UDP broadcast
// every other client instead listens for passively, full stop, no amount
// of restricting to one known host works around that (there's no socket
// API to restrict in the first place). What *is* buildable: given a host
// the user already typed in, actively probe each of Unison's four
// well-known fixed handshake ports against it in turn, so the user only
// has to know the IP, not also which of the four ports its particular
// emulator uses. Not a listen, an active short-timeout connect-and-check,
// same distinction PlayerActivity.kt's own manual-entry vs. beacon split
// already draws for the native clients.
const PROBE_PORTS = [
  { port: 6800, label: 'Dolphin' },
  { port: 6810, label: 'Azahar' },
  { port: 6820, label: 'melonDS' },
  { port: 6840, label: 'Cemu' },
];

// Real WS connect + a real, WASM-parsed hello (unison_wasm_parse_hello --
// same validation beginSession() itself uses below, not a second
// hand-rolled check, matching this file's own top comment on why parallel
// protocol reimplementations are avoided) -- closed immediately either way,
// never handed off into the real session; beginSession() opens its own
// fresh connection from scratch once a port is found, exactly as if the
// user had typed it in by hand.
async function probeOnePort(wasmModule, host, port, timeoutMs) {
  return new Promise((resolve) => {
    let settled = false;
    let socket;
    const finish = (found) => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      if (socket) {
        socket.onmessage = socket.onerror = socket.onclose = null;
        try { socket.close(); } catch { /* already closed/never opened */ }
      }
      resolve(found);
    };
    const timer = setTimeout(() => finish(false), timeoutMs);
    try {
      socket = new WebSocket(`ws://${host}:${port}/`);
    } catch {
      finish(false);
      return;
    }
    socket.onmessage = (e) => {
      if (typeof e.data !== 'string') { finish(false); return; }
      const bytes = new TextEncoder().encode(e.data);
      const ptr = wasmModule._malloc(bytes.length);
      wasmModule.HEAPU8.set(bytes, ptr);
      const isHello = wasmModule.ccall('unison_wasm_peek_handshake_message', 'number',
          ['number', 'number'], [ptr, bytes.length]) === 1;
      const parsed = isHello && wasmModule.ccall('unison_wasm_parse_hello', 'number',
          ['number', 'number'], [ptr, bytes.length]);
      wasmModule._free(ptr);
      finish(!!parsed);
    };
    socket.onerror = () => finish(false);
    socket.onclose = () => finish(false);
  });
}

async function probeHost(host) {
  const wasmModule = await wasmModulePromise;
  const results = await Promise.all(
    PROBE_PORTS.map(({ port }) => probeOnePort(wasmModule, host, port, 1500).then((ok) => ({ port, ok })))
  );
  return results.find((r) => r.ok) || null;
}

const probePortsBtn = document.getElementById('probePortsBtn');
const probeStatusEl = document.getElementById('probeStatus');
probePortsBtn.addEventListener('click', async () => {
  const host = hostInput.value.trim();
  if (!host) {
    probeStatusEl.textContent = 'Bitte zuerst eine IP-Adresse eingeben.';
    return;
  }
  probePortsBtn.disabled = true;
  probeStatusEl.textContent = 'Suche läuft...';
  const hit = await probeHost(host);
  probePortsBtn.disabled = false;
  if (hit) {
    portInput.value = String(hit.port);
    const label = PROBE_PORTS.find((p) => p.port === hit.port)?.label || '';
    probeStatusEl.textContent = `Gefunden: ${label} auf Port ${hit.port}.`;
  } else {
    probeStatusEl.textContent = 'Kein Server auf den bekannten Ports gefunden.';
  }
});

connectForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const host = hostInput.value.trim();
  const port = parseInt(portInput.value, 10);
  if (!host || !port) return;
  localStorage.setItem('unisonLastHost', host);
  localStorage.setItem('unisonLastPort', String(port));
  connectErrorEl.textContent = '';
  connectStatusEl.textContent = t('status_connecting');
  connectSubmitEl.disabled = true;
  // Created here (inside the submit handler's call chain, itself triggered
  // by a user gesture) so the browser's autoplay policy -- which requires
  // audio to start from a user gesture -- is satisfied without any extra
  // "click to enable sound" step.
  beginSession(host, port);
});

async function beginSession(host, port) {
// unison_button_bit (unison/protocol.h) -- the *wire* bit layout
// touch_and_buttons/extended_input frames use for their own `buttons`
// field, a completely different bit assignment than BUTTONS' own local
// bits below (which only ever had to agree with themselves, this client
// never having sent anything but a plain gba_buttons frame before X/Y/ZL/ZR
// were added). sendKeys() translates through this map rather than reusing
// BUTTONS' local bits directly whenever the session needs one of the two
// wire shapes gba_buttons has no room for X/Y/ZL/ZR in at all.
const UNISON_BUTTON_BIT = {
  A: 1<<0, B: 1<<1, X: 1<<2, Y: 1<<3, L: 1<<4, R: 1<<5, ZL: 1<<6, ZR: 1<<7,
  Select: 1<<8, Start: 1<<9, Up: 1<<10, Down: 1<<11, Left: 1<<12, Right: 1<<13,
};

// Order matches the other clients' own unified key-bindings list (Android's
// KeyBindingsActivity, iOS's KeyBindingsView): A, B, X, Y, Start, Select,
// D-pad Up/Down/Left/Right, L, R, ZL, ZR. X/Y/ZL/ZR are new -- this client
// never had them at all before (carried over unmodified from the original
// Dolphin-only web UI, see README.md's own "Scope", predating the
// touch_and_buttons/extended-input concept Cemu/Azahar/melonDS later
// added) -- only reachable on a touch_and_buttons/n3ds_touch_and_buttons
// session (see sendKeys()), silently unbindable-but-harmless otherwise,
// same as any other button a given server's console doesn't have.
const BUTTONS = [
  ['A', 1<<0, 'KeyX'], ['B', 1<<1, 'KeyZ'], ['X', 1<<10, 'KeyC'], ['Y', 1<<11, 'KeyV'],
  ['Start', 1<<3, 'Enter'], ['Select', 1<<2, 'ShiftRight'],
  ['Up', 1<<6, 'ArrowUp'], ['Down', 1<<7, 'ArrowDown'], ['Left', 1<<5, 'ArrowLeft'], ['Right', 1<<4, 'ArrowRight'],
  ['L', 1<<9, 'KeyA'], ['R', 1<<8, 'KeyS'], ['ZL', 1<<12, 'KeyQ'], ['ZR', 1<<13, 'KeyE'],
];
const nameToBit = {};
for (const [name, bit] of BUTTONS) nameToBit[name] = bit;

let keyState = 0;
// touch_and_buttons/n3ds_touch_and_buttons' own touch fields -- x/y are the
// bottom screen's own native pixel coordinates, meaningless (and sent as 0)
// whenever pressed is false (unison/protocol.h's own unison_touch_state
// comment: "a release carries no meaningful position"), same convention
// sendKeys() below already relies on. A gba_buttons session (Dolphin) never
// reads these (see sendKeys()'s own branch for that encoding) -- harmless
// to always track regardless of which kind of session is actually active.
let touchPressed = false;
let touchX = 0;
let touchY = 0;

const statusEl = document.getElementById('status');
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
let imageData = ctx.createImageData(240, 160);

// Desktop only: mobile lets object-fit:contain (see CSS) do the letterboxing
// responsively for free. Here we size the canvas element itself in exact
// pixels so #videoWrap -- an inline-block that shrink-wraps to its only
// normal-flow child, the canvas -- ends up exactly matching the visible
// image, with nothing left over for the settings gear (absolutely
// positioned inside #videoWrap) to float in.
function resizeDesktopCanvas() {
  if (isMobile) return;
  const aspect = canvas.width / canvas.height;
  let w = window.innerWidth * 0.96;
  let h = w / aspect;
  if (h > window.innerHeight * 0.96) {
    h = window.innerHeight * 0.96;
    w = h * aspect;
  }
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
}
window.addEventListener('resize', resizeDesktopCanvas);
resizeDesktopCanvas();

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let nextAudioTime = 0;

function playAudioChunk(sampleRate, channels, view, byteOffset, sampleCount) {
  const frameCount = sampleCount / channels;
  if (frameCount <= 0) return;
  const buffer = audioCtx.createBuffer(channels, frameCount, sampleRate);
  for (let ch = 0; ch < channels; ch++) {
    const channelData = buffer.getChannelData(ch);
    for (let i = 0; i < frameCount; i++) {
      channelData[i] = view.getInt16(byteOffset + (i * channels + ch) * 2, true) / 32768;
    }
  }
  const source = audioCtx.createBufferSource();
  source.buffer = buffer;
  source.connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  // Small safety cushion, and resync if playback ever falls behind real time
  // (e.g. after a stall) instead of trying to catch up by queueing forever.
  if (nextAudioTime < now + 0.05) nextAudioTime = now + 0.05;
  source.start(nextAudioTime);
  nextAudioTime += buffer.duration;
}

// unison_core (see this file's top comment) -- awaited here rather than at
// module scope so a submit before UnisonCore() resolves still works, just
// without the head start wasmModulePromise being kicked off early normally
// provides.
const wasmModule = await wasmModulePromise;

// Persistent WASM-heap scratch buffers, reused/grown across messages rather
// than malloc'd+freed per one -- framebufferPtr in particular *must*
// persist across calls (not just "may as an optimization"): it's the
// framebuffer_rgb565 unison_decode_video_frame patches
// UNISON_VIDEO_FORMAT_TILES updates onto, so it needs to still hold real
// prior content, not a fresh/blank buffer, every call after the first.
let videoMsgPtr = 0, videoMsgCap = 0;
let inflatedPtr = 0, inflatedCap = 0;
let framebufferPtr = 0, framebufferCap = 0;

function ensureCapacity(ptr, cap, needed) {
  if (needed <= cap) return [ptr, cap];
  if (ptr) wasmModule._free(ptr);
  return [wasmModule._malloc(needed), needed];
}

let ws;

function fail(reason) {
  // A failure before the video view is ever shown (bad host/port, refused
  // handshake, version mismatch) belongs back on the connect form, with
  // "Verbinden" re-enabled, rather than stuck behind the still-hidden game
  // view -- see showGame()'s own comment for the one-way switch this
  // mirrors.
  if (gameEl.style.display !== 'flex') {
    connectErrorEl.textContent = reason;
    connectStatusEl.textContent = 'IP-Adresse des Emulators eingeben';
    connectSubmitEl.disabled = false;
    lobbyEl.style.display = 'none';
    connectEl.style.display = 'flex';
  } else {
    statusEl.textContent = reason;
  }
  if (ws) ws.close();
}

function showGame() {
  // One-way: once the video view is up, later reconnect attempts (a
  // redirect hop, see session_ready below) shouldn't flash the connect/
  // lobby screens back in.
  connectEl.style.display = 'none';
  lobbyEl.style.display = 'none';
  gameEl.style.display = 'flex';
}

// Non-blocking: the stream is already live in the granted mode by the time
// this can even show (session_ready has already been sent by the server) --
// "Fortsetzen" just dismisses it, "Abbrechen" tears down the session same as
// a normal disconnect. Mirrors PlayerActivity's Android dialog 1:1.
function videoModeLabel(mode) {
  return t(VIDEO_MODE_OPTION_KEYS[mode] || VIDEO_MODE_OPTION_KEYS[VIDEO_MODE_DEFAULT]);
}
function showVideoModeFallback(requested, granted) {
  document.getElementById('videoModeFallbackTitle').textContent = t('video_mode_fallback_title');
  document.getElementById('videoModeFallbackMessage').textContent =
      t('video_mode_fallback_message', videoModeLabel(requested), videoModeLabel(granted));
  document.getElementById('videoModeFallbackContinue').textContent = t('video_mode_fallback_continue');
  document.getElementById('videoModeFallbackAbort').textContent = t('video_mode_fallback_abort');
  document.getElementById('videoModeFallbackPanel').style.display = 'flex';
}
document.getElementById('videoModeFallbackContinue').onclick = () => {
  document.getElementById('videoModeFallbackPanel').style.display = 'none';
};
document.getElementById('videoModeFallbackAbort').onclick = () => {
  document.getElementById('videoModeFallbackPanel').style.display = 'none';
  if (ws) ws.close();
  fail(t('status_disconnected'));
};

function connect(connectHost, connectPort) {
  ws = new WebSocket('ws://' + connectHost + ':' + connectPort + '/');
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => { connectStatusEl.textContent = t('status_handshake'); statusEl.textContent = t('status_handshake'); };
  ws.onclose = () => { if (gameEl.style.display === 'flex') statusEl.textContent = t('status_disconnected'); };
  ws.onerror = () => { if (gameEl.style.display !== 'flex') fail(t('status_connect_failed')); };
  // Text frames (typeof ev.data === 'string', always true for a WS text
  // message regardless of ws.binaryType, which only affects *binary*
  // messages) are the app-level handshake (unison/handshake.h); binary
  // ones are the existing Video/Audio/Input/ping wire format, unchanged by
  // any of this.
  ws.onmessage = (ev) => {
    if (typeof ev.data === 'string') {
      handleHandshakeMessage(ev.data);
    } else {
      handleBinaryMessage(ev.data);
    }
  };
}

// --- App-level handshake (unison/handshake.h, docs/protocol.md
// "Verbindungsaufbau: Handshake") -- every field access below goes through
// a WASM getter rather than hand-parsing the JSON text directly in JS, even
// though the browser has JSON.parse built in, so the field *names*/shape
// stay defined in exactly one place (unison/handshake.h) instead of a
// second hand-maintained copy here that could silently drift from it.
//
// hello.slots (unison_wasm_hello_slot_count/_index/_label/_occupied) is
// what tells apart a multi-slot stream type (GC_GBA_LINK: the lobby offers
// every configured player port, occupied or not, docs/protocol.md) from a
// single-slot one (every other stream type today, one client at a time) --
// slot_count > 1 shows the picker below and waits for a click; anything
// else sends hello_ack immediately with whatever single slot was offered
// (or 0 if none). This replaces the old Dolphin-only web client's own
// fetch()-based /status polling of ports 6801-6804 -- that was a page
// hard-wired to Dolphin's lobby shape; the standard hello/slots field this
// client uses instead is exactly what every native client (Android/3DS/
// Switch/NDS) already reads for the same purpose, so this works against
// any unison server, Dolphin's lobby included, with no special-casing. ---

// Captured from hello at parse time, read again once a slot is actually
// picked (hello_ack can be deferred behind the picker below, unlike a
// single-slot connect where it's sent immediately).
let pendingAck = null;
// What the last hello_ack actually requested -- compared against
// session_ready.video_mode once it arrives (see the msgType === 2 handler
// below), docs/protocol.md "Video-mode fallback". Set at send time, not
// read back out of videoModePref later, so a mode change in Settings mid-
// session (before the *next* connection) can't retroactively change what
// this comparison thinks was asked for.
let requestedVideoMode = null;

function sendHelloAck(requestedSlot) {
  const { wantsAudio, nativeWidth, nativeHeight, nativeFps, sampleRate, channels } = pendingAck;
  const ackCap = 512;
  const ackPtr = wasmModule._malloc(ackCap);
  requestedVideoMode = videoModePref;
  const ackLen = wasmModule.ccall('unison_wasm_build_hello_ack', 'number',
      ['number', 'number', 'number', 'number', 'number', 'number', 'number', 'string', 'number', 'number'],
      [requestedSlot, nativeWidth, nativeHeight, nativeFps, wantsAudio, sampleRate, channels,
       requestedVideoMode, ackPtr, ackCap]);
  const ackJson = wasmModule.UTF8ToString(ackPtr, ackLen);
  wasmModule._free(ackPtr);
  ws.send(ackJson);  // .send(string) -- the browser sends this as a WS text frame itself.
}

function showSlotPicker(slotCount) {
  connectEl.style.display = 'none';
  lobbyEl.style.display = 'flex';
  lobbyButtonsEl.innerHTML = '';
  lobbyStatusEl.textContent = t('lobby_pick_player');
  for (let i = 0; i < slotCount; i++) {
    const label = wasmModule.ccall('unison_wasm_hello_slot_label', 'string', ['number'], [i]);
    const occupied = wasmModule.ccall('unison_wasm_hello_slot_occupied', 'number', ['number'], [i]);
    const index = wasmModule.ccall('unison_wasm_hello_slot_index', 'number', ['number'], [i]);
    const btn = document.createElement('button');
    btn.className = 'slot';
    btn.disabled = !!occupied;
    btn.title = occupied ? 'Bereits verbunden' : 'Verbinden';
    btn.innerHTML =
        '<span class="tag">' + (label || ('P' + (i + 1))) + '</span>' +
        '<span class="info"><span class="name">' + (label || ('Slot ' + (i + 1))) + ' · ' +
        (occupied ? 'belegt' : 'frei') + '</span></span>' +
        '<span class="dot"></span>';
    btn.onclick = () => {
      lobbyStatusEl.textContent = t('status_connecting');
      sendHelloAck(index);
    };
    lobbyButtonsEl.appendChild(btn);
  }
}

function handleHandshakeMessage(text) {
  const bytes = new TextEncoder().encode(text);
  const bytesPtr = wasmModule._malloc(bytes.length);
  wasmModule.HEAPU8.set(bytes, bytesPtr);
  try {
    const msgType = wasmModule.ccall('unison_wasm_peek_handshake_message', 'number',
        ['number', 'number'], [bytesPtr, bytes.length]);

    if (msgType === 1) {  // hello
      if (!wasmModule.ccall('unison_wasm_parse_hello', 'number', ['number', 'number'],
                             [bytesPtr, bytes.length])) {
        fail('hello konnte nicht gelesen werden');
        return;
      }
      const serverVersion = wasmModule.ccall('unison_wasm_hello_protocol_version', 'number', [], []);
      if (serverVersion !== UNISON_PROTOCOL_VERSION) {
        fail('Server spricht Protokollversion ' + serverVersion + ', dieser Client unterstützt nur ' +
             'Version ' + UNISON_PROTOCOL_VERSION + ' -- bitte Client oder Server aktualisieren.');
        return;
      }
      // A redirect hop (session_ready.has_redirect below) reconnects to a
      // different port that sends its own fresh hello -- this always
      // reflects whichever connection is current, same as pendingAck.
      currentStreamType = wasmModule.ccall('unison_wasm_hello_stream_type', 'string', [], []);
      currentInputEncoding = wasmModule.ccall('unison_wasm_hello_input_encoding', 'string', [], []);
      canvas.style.imageRendering = bilinearFor(currentStreamType, filterPrefs) ? 'auto' : 'pixelated';
      const wantsAudio = wasmModule.ccall('unison_wasm_hello_has_audio', 'number', [], []);
      // Generous/native throughout: nothing about a browser tab justifies
      // asking the server to downscale its stream.
      const nativeWidth = wasmModule.ccall('unison_wasm_hello_video_width', 'number', [], []);
      const nativeHeight = wasmModule.ccall('unison_wasm_hello_video_height', 'number', [], []);
      const nativeFps = wasmModule.ccall('unison_wasm_hello_video_fps', 'number', [], []);
      const sampleRate = wantsAudio ?
          wasmModule.ccall('unison_wasm_hello_audio_sample_rate', 'number', [], []) : 48000;
      const channels = wantsAudio ?
          wasmModule.ccall('unison_wasm_hello_audio_channels', 'number', [], []) : 2;
      pendingAck = { wantsAudio, nativeWidth, nativeHeight, nativeFps, sampleRate, channels };

      const slotCount = wasmModule.ccall('unison_wasm_hello_slot_count', 'number', [], []);
      if (slotCount > 1) {
        showSlotPicker(slotCount);
        return;  // wait for a picker click -- see sendHelloAck() above.
      }
      const soloSlot = slotCount === 1 ?
          wasmModule.ccall('unison_wasm_hello_slot_index', 'number', ['number'], [0]) : 0;
      sendHelloAck(soloSlot);
      return;
    }

    if (msgType === 2) {  // session_ready
      if (!wasmModule.ccall('unison_wasm_parse_session_ready', 'number', ['number', 'number'],
                             [bytesPtr, bytes.length])) {
        fail('session_ready konnte nicht gelesen werden');
        return;
      }
      if (wasmModule.ccall('unison_wasm_ready_has_redirect', 'number', [], [])) {
        // Multi-slot lobby (GC_GBA_LINK): the slot just picked lives on a
        // different port -- close this connection, reconnect there, and
        // expect a fresh hello (this time single-slot, so hello_ack goes
        // out immediately, no second picker).
        const redirectHost = wasmModule.ccall('unison_wasm_ready_redirect_host', 'string', [], []);
        const redirectPort = wasmModule.ccall('unison_wasm_ready_redirect_port', 'number', [], []);
        ws.close();
        connect(redirectHost, redirectPort);
        return;
      }
      showGame();
      statusEl.textContent = t('status_connected');
      sendPing();
      // Empty grantedVideoMode means the server predates session_ready.
      // video_mode entirely -- skip the comparison rather than assuming
      // "tiles" was granted (docs/protocol.md "Video-mode fallback"), same
      // rule every other client applies.
      const grantedVideoMode = wasmModule.ccall('unison_wasm_ready_video_mode', 'string', [], []);
      if (grantedVideoMode && requestedVideoMode && grantedVideoMode !== requestedVideoMode) {
        showVideoModeFallback(requestedVideoMode, grantedVideoMode);
      }
      return;
    }

    if (msgType === 3) {  // handshake_error
      wasmModule.ccall('unison_wasm_parse_handshake_error', 'number', ['number', 'number'],
                        [bytesPtr, bytes.length]);
      const detail = wasmModule.ccall('unison_wasm_error_detail', 'string', [], []);
      fail(detail || 'Handshake vom Server abgelehnt.');
      return;
    }

    fail('Unerwartete Nachricht vom Server.');
  } finally {
    wasmModule._free(bytesPtr);
  }
}

// Bumped for every incoming video frame and captured before the (async)
// decompression below. WebSocket message events are delivered in order, but
// this handler awaits mid-frame, so two frames arriving close together can
// finish decompressing out of order (e.g. one has more to inflate, or the
// tab gets throttled in between). Painting a frame whose sequence number
// isn't still the latest would draw a stale image over a newer one that
// already rendered -- checked below, right before putImageData.
let latestVideoSeq = 0;

// --- Latency/frame-rate monitoring, shown in the settings gear (desktop) and
// hamburger menu (mobile) so a laggy connection is diagnosable at a glance:
// ping (round trip to the server, which echoes the timestamp back
// immediately on receipt) isolates network latency, while frame rate (time
// between rendered video frames) separately reveals a decode/render
// bottleneck even when the network itself is fine. This ping/pong exchange
// (type 4/5) is this client's own addition, not part of unison/protocol.h
// -- a server that doesn't recognize it simply never sends type 5 back, so
// the stats just stay at "--" rather than anything breaking. ---
let pingMs = null;
let lastFrameAt = null;
let frameIntervalMs = null;

function updateStats() {
  const pingText = pingMs === null ? '--' : Math.round(pingMs);
  const fpsText =
      frameIntervalMs === null || frameIntervalMs <= 0 ? '--' : Math.round(1000 / frameIntervalMs);
  for (const id of ['statPing', 'statPingMobile']) {
    const el = document.getElementById(id);
    if (el) el.textContent = pingText;
  }
  for (const id of ['statFps', 'statFpsMobile']) {
    const el = document.getElementById(id);
    if (el) el.textContent = fpsText;
  }
}

function sendPing() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  const msg = new Uint8Array(9);
  msg[0] = 4;
  new DataView(msg.buffer).setFloat64(1, performance.now(), true);
  ws.send(msg);
}
setInterval(sendPing, 1000);

function handleBinaryMessage(msgBuffer) {
  const view = new DataView(msgBuffer);
  const type = view.getUint8(0);

  if (type === 3) {  // audio
    const bytes = new Uint8Array(msgBuffer);
    const ptr = wasmModule._malloc(bytes.length);
    wasmModule.HEAPU8.set(bytes, ptr);
    try {
      if (!wasmModule.ccall('unison_wasm_parse_audio_frame', 'number', ['number', 'number'],
                             [ptr, bytes.length])) {
        return;
      }
      const sampleRate = wasmModule.ccall('unison_wasm_audio_sample_rate', 'number', [], []);
      const channels = wasmModule.ccall('unison_wasm_audio_channels', 'number', [], []);
      const sampleCount = wasmModule.ccall('unison_wasm_audio_sample_count', 'number', [], []);
      const samplesOffset = wasmModule.ccall('unison_wasm_audio_samples_offset', 'number',
                                              ['number'], [ptr]);
      playAudioChunk(sampleRate, channels, view, samplesOffset, sampleCount);
    } finally {
      wasmModule._free(ptr);
    }
    return;
  }

  if (type === 5) {  // pong
    pingMs = performance.now() - view.getFloat64(1, true);
    updateStats();
    return;
  }

  if (type !== 1) return;
  handleVideoMessage(msgBuffer);
}

async function handleVideoMessage(msgBuffer) {
  const seq = ++latestVideoSeq;
  const bytes = new Uint8Array(msgBuffer);
  [videoMsgPtr, videoMsgCap] = ensureCapacity(videoMsgPtr, videoMsgCap, bytes.length);
  wasmModule.HEAPU8.set(bytes, videoMsgPtr);
  if (!wasmModule.ccall('unison_wasm_parse_video_header', 'number', ['number', 'number'],
                         [videoMsgPtr, bytes.length])) {
    return;
  }

  const width = wasmModule.ccall('unison_wasm_video_width', 'number', [], []);
  const height = wasmModule.ccall('unison_wasm_video_height', 'number', [], []);
  const format = wasmModule.ccall('unison_wasm_video_format', 'number', [], []);
  const compressedOffset = wasmModule.ccall('unison_wasm_video_compressed_offset', 'number',
                                             ['number'], [videoMsgPtr]);
  const compressedSize = wasmModule.ccall('unison_wasm_video_compressed_size', 'number', [], []);
  const compressed = bytes.slice(compressedOffset, compressedOffset + compressedSize);

  // Deflate decompression stays native browser code, not WASM -- see
  // wasm_bridge.c's own top comment for why.
  const rawBuf = await new Response(
      new Blob([compressed]).stream().pipeThrough(new DecompressionStream('deflate-raw'))
  ).arrayBuffer();
  if (seq !== latestVideoSeq) return;  // A newer frame already arrived; this one is stale.

  const now = performance.now();
  if (lastFrameAt !== null) {
    const dt = now - lastFrameAt;
    frameIntervalMs = frameIntervalMs === null ? dt : frameIntervalMs * 0.8 + dt * 0.2;
    updateStats();
  }
  lastFrameAt = now;

  const inflatedBytes = new Uint8Array(rawBuf);
  [inflatedPtr, inflatedCap] = ensureCapacity(inflatedPtr, inflatedCap, inflatedBytes.length);
  wasmModule.HEAPU8.set(inflatedBytes, inflatedPtr);

  const neededFbCap = width * height * 2;
  if (neededFbCap > framebufferCap) {
    // Only ever grows alongside a resolution change, which the server always
    // sends as a full (non-TILES) frame -- see unison/protocol.h's own note
    // that the first frame after connect is always full for exactly this
    // reason -- so losing the old, now-wrong-sized buffer's content here is
    // fine, not a partial-tile-patch-onto-garbage risk.
    [framebufferPtr, framebufferCap] = ensureCapacity(framebufferPtr, framebufferCap, neededFbCap);
  }

  const ok = wasmModule.ccall('unison_wasm_decode_video_frame', 'number',
      ['number', 'number', 'number', 'number', 'number', 'number', 'number'],
      [format, inflatedPtr, inflatedBytes.length, width, height, framebufferPtr, framebufferCap]);
  if (!ok) return;

  if (imageData.width !== width || imageData.height !== height) {
    canvas.width = width; canvas.height = height;
    imageData = ctx.createImageData(width, height);
    resizeDesktopCanvas();
  }

  // Always re-converts the *whole* persistent RGB565 framebuffer to the
  // canvas's RGBA8 ImageData, even after a UNISON_VIDEO_FORMAT_TILES frame
  // that only patched part of it in WASM memory -- simpler than also
  // tracking which tiles changed just to skip re-converting the rest, and
  // cheap enough at these resolutions that it's not worth that complexity.
  // The *decode* into framebuffer_rgb565 above is still the real, correct
  // partial-tile-patch semantics (unison_decode_video_frame, shared with
  // every other client) -- only this last RGB565->RGBA8 color-space
  // conversion is unconditionally whole-frame, the same way each platform's
  // actual on-screen blit is its own platform-specific last step regardless
  // (Android's Bitmap.Config.RGB_565 doesn't even need a conversion at all).
  const fb = wasmModule.HEAPU8.subarray(framebufferPtr, framebufferPtr + width * height * 2);
  const fbView = new DataView(fb.buffer, fb.byteOffset, fb.byteLength);
  const data = imageData.data;
  for (let i = 0; i < width * height; i++) {
    const p = fbView.getUint16(i * 2, true);
    const r = (p >> 11) & 0x1F, g = (p >> 5) & 0x3F, b = p & 0x1F;
    data[i * 4 + 0] = (r * 255 / 31) | 0;
    data[i * 4 + 1] = (g * 255 / 63) | 0;
    data[i * 4 + 2] = (b * 255 / 31) | 0;
    data[i * 4 + 3] = 255;
  }
  ctx.putImageData(imageData, 0, 0);
}

connect(host, port);

// keyState is always kept in BUTTONS' own local bit layout (unchanged,
// still what codeToButton/nameToBit and the keydown/keyup/touch listeners
// below all use) -- translated into unison_button_bit's wire layout here,
// on send, only for the two shapes that need it. touch_x/touch_y/pressed
// and (for extended_input) both analog sticks are always sent as
// 0/not-pressed/centered -- no real touch or physical-stick input built
// out for this client yet, out of scope for what this translation itself
// adds (X/Y/ZL/ZR reachable via keyboard/on-screen-button binding, same as
// every other button here already was).
function unisonButtonsFromKeyState() {
  let bits = 0;
  for (const [name, bit] of BUTTONS) {
    if (keyState & bit) bits |= UNISON_BUTTON_BIT[name];
  }
  return bits;
}

function sendKeys() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  let bufPtr, n;
  if (currentInputEncoding === 'touch_and_buttons') {
    bufPtr = wasmModule._malloc(10);
    n = wasmModule.ccall('unison_wasm_build_touch_and_buttons_frame', 'number',
                          ['number', 'number', 'number', 'number', 'number'],
                          [touchPressed ? 1 : 0, touchX, touchY, unisonButtonsFromKeyState(), bufPtr]);
  } else if (currentInputEncoding === 'n3ds_touch_and_buttons') {
    bufPtr = wasmModule._malloc(18);
    // Sticks always centered (0, 0) here -- same "no physical-stick input
    // built out for this client yet" scope note as the frame's own
    // buttons-translation comment above.
    n = wasmModule.ccall('unison_wasm_build_extended_input_frame', 'number',
                          ['number', 'number', 'number', 'number', 'number', 'number', 'number', 'number', 'number'],
                          [touchPressed ? 1 : 0, touchX, touchY, unisonButtonsFromKeyState(), 0, 0, 0, 0, bufPtr]);
  } else {
    bufPtr = wasmModule._malloc(3);
    n = wasmModule.ccall('unison_wasm_build_input_frame', 'number', ['number', 'number'],
                          [keyState, bufPtr]);
  }
  const msg = wasmModule.HEAPU8.slice(bufPtr, bufPtr + n);  // .slice() copies -- ws.send needs its
                                                             // own bytes, not a view into memory
                                                             // about to be freed below.
  wasmModule._free(bufPtr);
  ws.send(msg);
}

// --- Physical keyboard (desktop, or a Bluetooth keyboard paired to a phone) ---
// loadBindings/assignBinding/buildCodeMap: keybindings.js (pure, unit-tested
// there -- see keybindings_test.mjs). bindings/codeToButton stay the same
// object references throughout (mutated in place via Object.assign, not
// reassigned) since other closures below capture them by reference.
const stored = JSON.parse(localStorage.getItem('unisonWebBindings') || '{}');
const bindings = loadBindings(BUTTONS, stored);
function saveBindings() { localStorage.setItem('unisonWebBindings', JSON.stringify(bindings)); }
const codeToButton = {};
function rebuildCodeMap() {
  for (const k in codeToButton) delete codeToButton[k];
  Object.assign(codeToButton, buildCodeMap(BUTTONS, bindings));
}
rebuildCodeMap();
window.addEventListener('keydown', (e) => {
  const bit = codeToButton[e.code];
  if (!bit) return;
  e.preventDefault();
  if (!(keyState & bit)) { keyState |= bit; sendKeys(); }
});
window.addEventListener('keyup', (e) => {
  const bit = codeToButton[e.code];
  if (!bit) return;
  e.preventDefault();
  if (keyState & bit) { keyState &= ~bit; sendKeys(); }
});

// --- Touch (canvas #screen): mouse/touch/pen via the unified Pointer
// Events API -- one code path for both desktop click-drag and mobile touch,
// same reasoning VirtualStick's own touch handling has elsewhere in this
// client. #touchControls' own .tbtn buttons sit visually on top (their own
// pointer-events:auto, see CSS) but the container itself is
// pointer-events:none, so a drag anywhere else over the video reaches this
// listener on the canvas underneath -- no explicit z-index coordination
// needed between the two.
//
// Coordinate mapping direct port of clients/android's own
// PlayerActivity.sendMappedTouch() (that function's own comment has the
// full "ContentScale.Fit letterbox, clamp stray taps to the nearest edge"
// rationale) -- canvas.width/height (the backing-buffer resolution, kept in
// sync with the server's actual video size in decodeAndDrawFrame, not the
// CSS-displayed size) is this client's own equivalent of that function's
// bitmapWidth/bitmapHeight; getBoundingClientRect() is this client's own
// equivalent of Compose's containerSize, correct for both desktop (explicit
// aspect-matched sizing, resizeDesktopCanvas) and mobile (object-fit:
// contain, real letterboxing) without needing to know which mode is active.
function sendMappedTouch(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  if (rect.width <= 0 || rect.height <= 0 || canvas.width <= 0 || canvas.height <= 0) return;

  const scale = Math.min(rect.width / canvas.width, rect.height / canvas.height);
  const offsetX = (rect.width - canvas.width * scale) / 2;
  const offsetY = (rect.height - canvas.height * scale) / 2;

  touchPressed = true;
  touchX = Math.min(Math.max(Math.round((clientX - rect.left - offsetX) / scale), 0), canvas.width - 1);
  touchY = Math.min(Math.max(Math.round((clientY - rect.top - offsetY) / scale), 0), canvas.height - 1);
  sendKeys();
}

function releaseTouch() {
  if (!touchPressed) return;
  touchPressed = false;
  touchX = 0;
  touchY = 0;
  sendKeys();
}

let activeTouchPointerId = null;
canvas.addEventListener('pointerdown', (e) => {
  if (activeTouchPointerId !== null) return; // one touch point at a time, same as a real 3DS/DS
  activeTouchPointerId = e.pointerId;
  canvas.setPointerCapture(e.pointerId); // keeps receiving move/up even if the pointer leaves the canvas mid-drag
  sendMappedTouch(e.clientX, e.clientY);
});
canvas.addEventListener('pointermove', (e) => {
  if (e.pointerId !== activeTouchPointerId) return;
  sendMappedTouch(e.clientX, e.clientY);
});
function endTouchPointer(e) {
  if (e.pointerId !== activeTouchPointerId) return;
  activeTouchPointerId = null;
  releaseTouch();
}
canvas.addEventListener('pointerup', endTouchPointer);
canvas.addEventListener('pointercancel', endTouchPointer);

const touchControlsEl = document.getElementById('touchControls');

// --- Shared (used to be split across the isMobile/!isMobile blocks below,
// one half each -- both now live in #keyBindingsPanel, reachable from either
// #settingsPanel (desktop) or #menuPanel (mobile), see openKeyBindingsPanel()
// above): the keyboard-rebind table and the gamepad-binding list. Neither
// has anything device-specific about its own logic -- BUTTONS, bindings,
// keyState, sendKeys() are all already shared globals -- the old split was
// purely an artifact of where each list used to be *displayed*, not
// anything about how either works. ---
const settingsTableBody = document.getElementById('settingsTableBody');

function renderSettings() {
  settingsTableBody.innerHTML = '';
  for (const [name, bit] of BUTTONS) {
    const row = document.createElement('tr');
    const nameCell = document.createElement('td');
    nameCell.textContent = name;
    const keyCell = document.createElement('td');
    keyCell.textContent = bindings[name];
    const actionCell = document.createElement('td');
    const btn = document.createElement('button');
    btn.textContent = t('settings_bind');
    btn.onclick = () => {
      btn.textContent = t('settings_press_key');
      const onKey = (e) => {
        e.preventDefault();
        Object.assign(bindings, assignBinding(bindings, name, e.code));
        saveBindings();
        rebuildCodeMap();
        renderSettings();
        window.removeEventListener('keydown', onKey, true);
      };
      window.addEventListener('keydown', onKey, true);
    };
    actionCell.appendChild(btn);
    row.appendChild(nameCell);
    row.appendChild(keyCell);
    row.appendChild(actionCell);
    settingsTableBody.appendChild(row);
  }
}
renderSettings();

const GAMEPAD_DEFAULTS = {A: 0, B: 1, Select: 8, Start: 9, Up: 12, Down: 13, Left: 14,
                          Right: 15, L: 4, R: 5};
const gamepadBindings =
    JSON.parse(localStorage.getItem('unisonWebGamepadBindings') || 'null') ||
    Object.assign({}, GAMEPAD_DEFAULTS);
function saveGamepadBindings() {
  localStorage.setItem('unisonWebGamepadBindings', JSON.stringify(gamepadBindings));
}
let activeGamepadIndex = null;
window.addEventListener('gamepadconnected', (e) => { activeGamepadIndex = e.gamepad.index; });
window.addEventListener('gamepaddisconnected', (e) => {
  if (activeGamepadIndex === e.gamepad.index) activeGamepadIndex = null;
});
let lastGamepadState = 0;
function pollGamepad() {
  if (activeGamepadIndex !== null) {
    const gp = navigator.getGamepads()[activeGamepadIndex];
    if (gp) {
      let newState = 0;
      for (const [name, bit] of BUTTONS) {
        const idx = gamepadBindings[name];
        if (idx !== undefined && gp.buttons[idx] && gp.buttons[idx].pressed) newState |= bit;
      }
      if (newState !== lastGamepadState) {
        // Merge: clear bits the gamepad used to hold, set the ones it
        // holds now, leave bits held by keyboard/touch alone.
        keyState = (keyState & ~lastGamepadState) | newState;
        lastGamepadState = newState;
        sendKeys();
      }
    }
  }
  requestAnimationFrame(pollGamepad);
}
requestAnimationFrame(pollGamepad);

function rebindGamepadButton(name, onDone) {
  if (activeGamepadIndex === null) { onDone(); return; }
  const baseline = navigator.getGamepads()[activeGamepadIndex].buttons.map((b) => b.pressed);
  function check() {
    const gp = navigator.getGamepads()[activeGamepadIndex];
    if (gp) {
      for (let i = 0; i < gp.buttons.length; i++) {
        if (gp.buttons[i].pressed && !baseline[i]) {
          gamepadBindings[name] = i;
          saveGamepadBindings();
          onDone();
          return;
        }
      }
    }
    requestAnimationFrame(check);
  }
  requestAnimationFrame(check);
}

const gamepadListEl = document.getElementById('gamepadBindingsList');
function renderGamepadBindingsList() {
  gamepadListEl.innerHTML = '';
  if (activeGamepadIndex === null) {
    const hint = document.createElement('div');
    hint.className = 'hint';
    hint.textContent = t('key_bindings_no_gamepad');
    gamepadListEl.appendChild(hint);
  }
  for (const [name] of BUTTONS) {
    const row = document.createElement('div');
    row.className = 'menu-row';
    const label = document.createElement('span');
    label.textContent = name + ': ' +
        (gamepadBindings[name] !== undefined ? ('Knopf ' + gamepadBindings[name]) :
                                                t('settings_unbound'));
    const btn = document.createElement('button');
    btn.className = 'pill';
    btn.textContent = t('settings_bind');
    btn.onclick = () => {
      btn.textContent = t('key_bindings_press_button');
      rebindGamepadButton(name, renderGamepadBindingsList);
    };
    row.appendChild(label);
    row.appendChild(btn);
    gamepadListEl.appendChild(row);
  }
}

// Own overlay (#keyBindingsPanel), opened from either settings panel's
// "Tastenzuweisungen" row -- same returnPanel pattern #languagePanel/
// #videoModePanel use (see those two above, outside beginSession -- this one
// has to live in here instead, since it calls renderSettings()/
// renderGamepadBindingsList() just above, both beginSession-scoped). Unlike
// language/video-mode's single-tap-and-done pickers, there's no one value to
// pick here (it's a whole interactive screen), so it needs its own explicit
// back button instead of returning automatically.
const keyBindingsPanel = document.getElementById('keyBindingsPanel');
let keyBindingsReturnPanel = null;

function openKeyBindingsPanel(returnPanel) {
  keyBindingsReturnPanel = returnPanel;
  returnPanel.style.display = 'none';
  document.getElementById('keyBindingsPanelTitle').textContent = t('settings_key_bindings');
  document.getElementById('gamepadSectionLabel').textContent = t('key_bindings_gamepad_section');
  document.getElementById('closeKeyBindings').textContent = t('back');
  renderSettings();
  renderGamepadBindingsList();
  keyBindingsPanel.style.display = 'flex';
}

document.getElementById('keyBindingsRowDesktop').onclick = () => openKeyBindingsPanel(document.getElementById('settingsPanel'));
document.getElementById('keyBindingsRowMobile').onclick = () => openKeyBindingsPanel(document.getElementById('menuPanel'));
document.getElementById('closeKeyBindings').onclick = () => {
  keyBindingsPanel.style.display = 'none';
  if (keyBindingsReturnPanel) keyBindingsReturnPanel.style.display = 'flex';
};

// Own overlay (#bilinearPanel), same pattern -- doesn't actually need to be
// inside beginSession (renderFilterRows('filterRows') already ran once,
// outside, right after it was declared), but kept next to #keyBindingsPanel's
// wiring here rather than split across the beginSession boundary for no
// real reason, since both rows live in the same two parent panels.
const bilinearPanel = document.getElementById('bilinearPanel');
let bilinearReturnPanel = null;

function openBilinearPanel(returnPanel) {
  bilinearReturnPanel = returnPanel;
  returnPanel.style.display = 'none';
  document.getElementById('bilinearPanelTitle').textContent = t('settings_antialiasing');
  document.getElementById('closeBilinear').textContent = t('back');
  bilinearPanel.style.display = 'flex';
}

document.getElementById('bilinearRowDesktop').onclick = () => openBilinearPanel(document.getElementById('settingsPanel'));
document.getElementById('bilinearRowMobile').onclick = () => openBilinearPanel(document.getElementById('menuPanel'));
document.getElementById('closeBilinear').onclick = () => {
  bilinearPanel.style.display = 'none';
  if (bilinearReturnPanel) bilinearReturnPanel.style.display = 'flex';
};

// --- Mobile-only: on-screen touch overlay (drawn on top of the fullscreen
// video like a typical mobile emulator) and the hamburger menu button
// itself. The gamepad-binding list used to live inline here too (now shared
// above, in #keyBindingsPanel) -- opening the mobile menu no longer needs to
// pre-render it, openKeyBindingsPanel() does that itself on demand. ---
if (isMobile) {
  touchControlsEl.querySelectorAll('.tbtn').forEach((btn) => {
    const bit = nameToBit[btn.dataset.name];
    const press = (e) => {
      e.preventDefault();
      btn.classList.add('pressed');
      if (!(keyState & bit)) { keyState |= bit; sendKeys(); }
    };
    const release = (e) => {
      e.preventDefault();
      btn.classList.remove('pressed');
      if (keyState & bit) { keyState &= ~bit; sendKeys(); }
    };
    btn.addEventListener('touchstart', press, {passive: false});
    btn.addEventListener('touchend', release, {passive: false});
    btn.addEventListener('touchcancel', release, {passive: false});
  });

  const overlayStored = localStorage.getItem('unisonWebShowOverlay');
  const showOverlay = overlayStored === null ? true : overlayStored === 'true';
  touchControlsEl.style.display = showOverlay ? 'block' : 'none';

  // Best-effort true fullscreen (hides browser chrome too); harmless if the
  // browser blocks it since the CSS-driven fullscreen layout still applies.
  document.documentElement.requestFullscreen?.().catch(() => {});

  const menuButton = document.getElementById('menuButton');
  const menuPanel = document.getElementById('menuPanel');
  const overlayToggle = document.getElementById('toggleOverlay');
  overlayToggle.checked = showOverlay;
  overlayToggle.onchange = () => {
    touchControlsEl.style.display = overlayToggle.checked ? 'block' : 'none';
    localStorage.setItem('unisonWebShowOverlay', overlayToggle.checked);
  };

  menuButton.style.display = 'flex';
  menuButton.onclick = () => { menuPanel.style.display = 'flex'; };
  document.getElementById('closeMenu').onclick = () => { menuPanel.style.display = 'none'; };
}

// The desktop keyboard-rebind table/gamepad list have no purpose on a touch
// device -- it shows the mobile overlay/hamburger menu instead (see above).
// This just wires the gear button itself now; the keybindings screen it
// leads to (#keyBindingsPanel) is shared, see above.
if (!isMobile) {
  const settingsButton = document.getElementById('settingsButton');
  const settingsPanel = document.getElementById('settingsPanel');

  settingsButton.style.display = 'flex';
  settingsButton.onclick = () => { settingsPanel.style.display = 'flex'; };
  document.getElementById('closeSettings').onclick = () => { settingsPanel.style.display = 'none'; };
}
}  // beginSession
</script>
</body></html>
