name: build

# Stage 1 of the finlink CI pipeline: build-smoke only (configure + compile
# every target). No unit tests wired in yet (finlink/core/tests' ctest
# suite and clients/web/bridge_test.mjs stay a manual/local step for now,
# see docs/capabilities.md and the CI plan this workflow came from) —
# deeper tiers (unit tests, simulated host<->client integration, real
# device/emulator e2e) are deliberately later work.
#
# This repo previously had no CI at all, so every job here is new. Package
# lists for the devkitPro-based jobs (3ds/switch/nds) are taken verbatim
# from each client's own README "Building" section, which is the
# documented ground truth for a from-scratch machine -- they haven't been
# empirically re-verified inside GitHub's containers yet, so a first run
# may need a small package-name correction.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  capabilities:
    name: capability matrix lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_capabilities.py

  core:
    name: core (native, build-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S core -B build/core -DFINLINK_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build/core -j"$(nproc)"

  android:
    name: android (assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Provisions the SDK and accepts licenses; the NDK + CMake 3.22.1
      # externalNativeBuild pulls (see app/build.gradle.kts) are fetched by
      # AGP itself on first use, same as a fresh local checkout.
      - uses: android-actions/setup-android@v3
      - name: gradlew assembleDebug
        working-directory: clients/android
        run: ./gradlew :app:assembleDebug --stacktrace

  build-3ds:
    # Job id can't start with a digit (GitHub Actions schema rule) -- "3ds"
    # alone was rejected outright at parse time (zero jobs created, whole
    # workflow run failed in 0s), hence the "build-" prefix here even
    # though every other job id in this file is just the target name.
    name: 3ds (.3dsx)
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      # Package list from clients/3ds/README.md "Building".
      - name: Install 3DS dev packages
        run: dkp-pacman -Sy --noconfirm libctru citro2d citro3d 3dstools general-tools 3ds-cmake devkitarm-cmake 3ds-pkg-config
      - name: Configure
        run: |
          cmake -S clients/3ds -B build/3ds \
            -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/3DS.cmake" \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/3ds -j"$(nproc)"

  switch:
    name: switch (.nro)
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      # Package list from clients/switch/README.md "Building".
      - name: Install Switch dev packages
        run: dkp-pacman -Sy --noconfirm libnx switch-glfw switch-mesa switch-libdrm_nouveau switch-pkg-config switch-zlib switch-cmake switch-tools dkp-cmake-common-utils dkp-toolchain-vars
      - name: Configure
        run: |
          cmake -S clients/switch -B build/switch \
            -DPLATFORM_SWITCH=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/switch --target finlink-switch.nro -j"$(nproc)"

  nds:
    name: nds (.nds, feasibility client)
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      # Package list from clients/nds/README.md "Building" (same devkitARM
      # toolchain as the 3ds job, different libs -- ndstool itself ships in
      # general-tools alongside 3dstool).
      - name: Install NDS dev packages
        run: dkp-pacman -Sy --noconfirm libnds dswifi maxmod-nds calico general-tools
      - name: Build (classic two-ELF Makefile, no CMake -- see clients/nds/README.md)
        working-directory: clients/nds
        run: make

  web:
    name: web (wasm bridge + bridge_test.mjs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # clients/web/build_wasm.sh only requires emsdk to exist at this
      # exact path, not that it's a registered git submodule (the repo
      # doesn't actually have one registered yet, see the script's own
      # comment) -- a plain clone satisfies it without touching
      # .gitmodules from CI.
      - name: Fetch emsdk
        run: git clone --depth 1 https://github.com/emscripten-core/emsdk.git clients/web/emsdk
      - name: Build wasm bridge + run bridge_test.mjs
        run: clients/web/build_wasm.sh
