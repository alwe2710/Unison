name: build

# Build-smoke (configure + compile every target) plus real functional
# tests where they exist: core/tests' ctest suite (protocol/deflate/
# inflate/websocket/video_encode/handshake) and clients/web/
# bridge_test.mjs (already run as build_wasm.sh's own last step). Deeper
# tiers -- simulated host<->client integration, real device/emulator e2e
# -- are still deliberately later work, see docs/capabilities.md and the
# CI plan this workflow came from.
#
# This repo previously had no CI at all, so every job here is new. Package
# lists for the devkitPro-based jobs (3ds/switch/nds) are taken verbatim
# from each client's own README "Building" section, which is the
# documented ground truth for a from-scratch machine, and have since been
# confirmed correct by a real green run.
#
# The devkitPro jobs check for their needed packages with `dkp-pacman -Q`
# (fully offline, reads the local package DB) before ever touching the
# network: a diagnostic CI run (2026-08-04) showed every package every one
# of these jobs needs is *already installed* in the base container images
# (devkitpro/devkitarm, devkitpro/devkita64) -- the "bare compiler
# toolchain only" assumption this comment used to state was wrong. Only if
# something's genuinely missing does a job fall back to `dkp-pacman -Sy`
# (network install, retried) -- and pkg.devkitpro.org is Cloudflare-fronted
# and occasionally answers a plain, non-authenticated CI runner request
# with a Cloudflare "Attention Required" 403 challenge page instead of the
# package (confirmed by hand: same command, same container, succeeded
# minutes later with zero code changes in between -- a transient block, not
# a wrong package name or a permanent one; still an open, unresolved issue
# upstream, e.g. devkitPro/pacman#62/#63). devkitPro itself doesn't
# officially support pacman inside CI for exactly this reason (their own
# recommendation is to use the Docker images as-is, which -Q now actually
# does); retrying a few times with a short delay, then a last-resort -S
# (no forced refresh), is the fallback safety net for the rare case a
# future package genuinely isn't in the image yet.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  capabilities:
    name: capability matrix lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_capabilities.py
      - run: python3 tools/check_button_mapping.py

  host-protocol-consistency:
    # Separate job from capabilities above (not just another step there):
    # this one shallow-clones all four host forks over the network to
    # compare their handshake_error code strings against each other (see
    # tools/check_host_protocol_consistency.py's own docstring) -- a
    # transient network hiccup fetching one of them shouldn't fail the
    # purely-local capability/button-mapping checks, and vice versa.
    name: host protocol consistency (cross-repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - run: python3 tools/check_host_protocol_consistency.py

  core:
    # Stage 2 of the CI plan: real functional tests (core/tests' ctest
    # suite -- protocol/deflate/inflate/websocket/video_encode/handshake),
    # not just "does it compile". Previously build-only
    # (-DUNISON_BUILD_TESTS=OFF) per the stage-1 plan; flipped on once
    # test_handshake.c actually existed to run (it's the one covering
    # hello_ack/session_ready.video_mode, the "Video-mode fallback"
    # negotiation this whole feature is built on).
    name: core (build + ctest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S core -B build/core -DUNISON_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/core -j"$(nproc)"
      - name: Test
        working-directory: build/core
        run: ctest --output-on-failure

  console-client-logic-tests:
    # Host-buildable logic tests for console-clients' non-SDK-coupled pieces
    # -- deliberately plain ubuntu-latest, not the devkitpro/devkita64/
    # devkitarm containers build-3ds/switch/nds below use: every file tested
    # here (screen_choice.c, audio_ring.c, audio_remix.{hpp,cpp}) is
    # deliberately kept free of any devkitPro-only headers specifically so
    # this doesn't need any cross-toolchain (or its Cloudflare-flaky
    # dkp-pacman install) at all. Does NOT exercise the real .3dsx/.nro/.nds
    # builds -- see build-3ds/switch/nds for that; this only proves the
    # extracted logic itself (dual-screen-client screen choice, dual-audio-
    # client remix/resample/ring-buffer) is correct.
    #
    # clients/3ds/tests and clients/nds/arm9/tests each build more than one
    # test binary from their tests/CMakeLists.txt (dual-screen-choice +
    # audio) -- one configure+build+ctest per client covers all of that
    # client's registered tests, nothing further to add here as more get
    # appended to those CMakeLists.txt files over time.
    name: console-client logic tests (3ds + nds + switch, host-built)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure + build + test (3DS)
        run: |
          cmake -S clients/3ds/tests -B build/3ds_logic_tests
          cmake --build build/3ds_logic_tests -j"$(nproc)"
      - name: Test (3DS)
        working-directory: build/3ds_logic_tests
        run: ctest --output-on-failure
      - name: Configure + build + test (NDS)
        run: |
          cmake -S clients/nds/arm9/tests -B build/nds_logic_tests
          cmake --build build/nds_logic_tests -j"$(nproc)"
      - name: Test (NDS)
        working-directory: build/nds_logic_tests
        run: ctest --output-on-failure
      - name: Configure + build + test (Switch)
        run: |
          cmake -S clients/switch/tests -B build/switch_logic_tests
          cmake --build build/switch_logic_tests -j"$(nproc)"
      - name: Test (Switch)
        working-directory: build/switch_logic_tests
        run: ctest --output-on-failure

  android:
    name: android (assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Provisions the SDK and accepts licenses; the NDK + CMake 3.22.1
      # externalNativeBuild pulls (see app/build.gradle.kts) are fetched by
      # AGP itself on first use, same as a fresh local checkout.
      - uses: android-actions/setup-android@v3
      - name: gradlew assembleDebug
        working-directory: clients/android
        run: ./gradlew :app:assembleDebug --stacktrace
      # Plain JVM unit tests (src/test/, no emulator/device) -- the
      # "generell: Sprach- und Bilinear-Filter-Settings" test category's
      # pure logic (Prefs.defaultBilinearFor(), LocaleHelper.resolveLocaleTag()).
      - name: gradlew testDebugUnitTest
        working-directory: clients/android
        run: ./gradlew :app:testDebugUnitTest --stacktrace

  build-3ds:
    # Job id can't start with a digit (GitHub Actions schema rule) -- "3ds"
    # alone was rejected outright at parse time (zero jobs created, whole
    # workflow run failed in 0s), hence the "build-" prefix here even
    # though every other job id in this file is just the target name.
    name: 3ds (.3dsx)
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      # Real finding from a diagnostic CI run (2026-08-04, see this file's
      # git history): every package this job needs is *already installed*
      # in the devkitpro/devkitarm:latest base image itself (`pacman -Q`
      # lists them all, straight out of /opt/devkitpro/pacman/var/lib/
      # pacman/local -- no fetch needed). The only reason this job ever
      # touched pkg.devkitpro.org was `dkp-pacman -Sy`'s unconditional
      # database refresh, not an actually missing package. `pacman -Q` is
      # fully offline (reads local package DB, no network) -- checking
      # first and only falling back to a real (retried) install when
      # something's genuinely missing means this job no longer depends on
      # pkg.devkitpro.org's Cloudflare-flaky uptime (see this file's own
      # top comment) in the common case at all, only if the base image
      # ever stops shipping one of these.
      - name: Ensure 3DS dev packages (offline check first)
        run: |
          if dkp-pacman -Q libctru citro2d citro3d 3dstools general-tools 3ds-cmake devkitarm-cmake 3ds-pkg-config > /dev/null 2>&1; then
            echo "All required packages already present in the base image -- skipping pkg.devkitpro.org entirely."
            exit 0
          fi
          echo "One or more packages missing from the base image -- falling back to a real install."
          for i in 1 2 3 4 5; do
            dkp-pacman -Sy --noconfirm libctru citro2d citro3d 3dstools general-tools 3ds-cmake devkitarm-cmake 3ds-pkg-config && exit 0
            echo "dkp-pacman -Sy failed (attempt $i/5), retrying in 20s..."
            sleep 20
          done
          echo "All -Sy attempts failed -- last resort: -S (no refresh)"
          dkp-pacman -S --noconfirm libctru citro2d citro3d 3dstools general-tools 3ds-cmake devkitarm-cmake 3ds-pkg-config
      - name: Configure
        run: |
          cmake -S clients/3ds -B build/3ds \
            -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/3DS.cmake" \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/3ds -j"$(nproc)"

  switch:
    name: switch (.nro)
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      # See the 3ds job's identical step for why this is offline-checked
      # first (every package already ships in the base image) rather than
      # always fetching.
      - name: Ensure Switch dev packages (offline check first)
        run: |
          if dkp-pacman -Q libnx switch-glfw switch-mesa switch-libdrm_nouveau switch-pkg-config switch-zlib switch-cmake switch-tools dkp-cmake-common-utils dkp-toolchain-vars > /dev/null 2>&1; then
            echo "All required packages already present in the base image -- skipping pkg.devkitpro.org entirely."
            exit 0
          fi
          echo "One or more packages missing from the base image -- falling back to a real install."
          for i in 1 2 3 4 5; do
            dkp-pacman -Sy --noconfirm libnx switch-glfw switch-mesa switch-libdrm_nouveau switch-pkg-config switch-zlib switch-cmake switch-tools dkp-cmake-common-utils dkp-toolchain-vars && exit 0
            echo "dkp-pacman -Sy failed (attempt $i/5), retrying in 20s..."
            sleep 20
          done
          echo "All -Sy attempts failed -- last resort: -S (no refresh)"
          dkp-pacman -S --noconfirm libnx switch-glfw switch-mesa switch-libdrm_nouveau switch-pkg-config switch-zlib switch-cmake switch-tools dkp-cmake-common-utils dkp-toolchain-vars
      - name: Configure
        run: |
          cmake -S clients/switch -B build/switch \
            -DPLATFORM_SWITCH=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/switch --target unison-switch.nro -j"$(nproc)"

  nds:
    name: nds (.nds, feasibility client)
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      # See the 3ds job's identical step for why this is offline-checked
      # first (every package already ships in the base image) rather than
      # always fetching. ndstool itself ships in general-tools alongside
      # 3dstool.
      - name: Ensure NDS dev packages (offline check first)
        run: |
          if dkp-pacman -Q libnds dswifi maxmod-nds calico general-tools > /dev/null 2>&1; then
            echo "All required packages already present in the base image -- skipping pkg.devkitpro.org entirely."
            exit 0
          fi
          echo "One or more packages missing from the base image -- falling back to a real install."
          for i in 1 2 3 4 5; do
            dkp-pacman -Sy --noconfirm libnds dswifi maxmod-nds calico general-tools && exit 0
            echo "dkp-pacman -Sy failed (attempt $i/5), retrying in 20s..."
            sleep 20
          done
          echo "All -Sy attempts failed -- last resort: -S (no refresh)"
          dkp-pacman -S --noconfirm libnds dswifi maxmod-nds calico general-tools
      - name: Build (classic two-ELF Makefile, no CMake -- see clients/nds/README.md)
        working-directory: clients/nds
        run: make

  web:
    name: web (wasm bridge + bridge_test.mjs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # clients/web/build_wasm.sh only requires emsdk to exist at this
      # exact path, not that it's a registered git submodule (the repo
      # doesn't actually have one registered yet, see the script's own
      # comment) -- a plain clone satisfies it without touching
      # .gitmodules from CI.
      - name: Fetch emsdk
        run: git clone --depth 1 https://github.com/emscripten-core/emsdk.git clients/web/emsdk
      - name: Build wasm bridge + run bridge_test.mjs
        run: clients/web/build_wasm.sh
      # settings.js has no wasm/emsdk dependency at all (pure language/
      # bilinear-filter logic, see its own comment) -- runs with whatever
      # plain `node` ubuntu-latest already ships (same runtime
      # bridge_test.mjs itself needs), no separate setup-node needed.
      - name: Run settings_test.mjs
        run: node clients/web/settings_test.mjs
      - name: Run keybindings_test.mjs
        run: node clients/web/keybindings_test.mjs
      # Real-browser tests (universal-client test category) -- needs its
      # own npm install (playwright/ws, clients/web/package.json) and a
      # real Chromium download, unlike the plain-node tests above.
      - name: Install Playwright + Chromium
        working-directory: clients/web
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run overlay.spec.mjs
        working-directory: clients/web
        run: npx playwright test

  ios:
    name: ios (XcodeGen + xcodebuild, Simulator)
    # The only real verification this client gets, full stop -- see
    # clients/ios/README.md's own comment: Xcode/SwiftUI don't exist on
    # Linux at all, unlike every other client's devkitPro/emsdk toolchain,
    # so there's no local "does it compile" step before this job runs.
    #
    # macos-14 (real first run, 2026-08-05): its Xcode 15.4 can't open the
    # project.pbxproj a `brew install xcodegen`-current XcodeGen writes
    # ("future Xcode project file format (77)") -- macos-15's newer
    # default Xcode reads it fine.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: clients/ios
        run: xcodegen generate
      - name: Build (Simulator, no signing)
        working-directory: clients/ios
        run: |
          xcodebuild build \
            -project Unison.xcodeproj -scheme Unison \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: Run UnisonTests
        working-directory: clients/ios
        # macos-15's Xcode 16.4 doesn't ship an "iPhone 15" simulator
        # anymore (real first run, 2026-08-05: only iPhone 16+ and iPad
        # models were available) -- "iPhone 16" instead.
        run: |
          xcodebuild test \
            -project Unison.xcodeproj -scheme Unison \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO
      # Unsigned device .ipa -- no Apple Developer account configured (see
      # clients/ios/README.md), so this can't be signed here at all.
      # AltStore/SideStore-style sideloading tools are the intended
      # install path: they re-sign an unsigned .ipa on-device using the
      # user's own free Apple ID via a paired AltServer, so an unsigned
      # archive is exactly the right artifact to publish, not a
      # limitation to work around.
      - name: Archive unsigned .ipa (device, for AltStore-style sideloading)
        working-directory: clients/ios
        run: |
          xcodebuild archive \
            -project Unison.xcodeproj -scheme Unison \
            -destination 'generic/platform=iOS' \
            -archivePath build/Unison.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= AD_HOC_CODE_SIGNING_ALLOWED=YES
          mkdir -p build/Payload
          cp -R build/Unison.xcarchive/Products/Applications/Unison.app build/Payload/
          cd build && zip -r Unison.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Unison-ipa
          path: clients/ios/build/Unison.ipa
