name: build

# Build-smoke (configure + compile every target) plus real functional
# tests where they exist: core/tests' ctest suite (protocol/deflate/
# inflate/websocket/video_encode/handshake) and clients/web/
# bridge_test.mjs (already run as build_wasm.sh's own last step). Deeper
# tiers -- simulated host<->client integration, real device/emulator e2e
# -- are still deliberately later work, see docs/capabilities.md and the
# CI plan this workflow came from.
#
# This repo previously had no CI at all, so every job here is new. Package
# lists for the devkitPro-based jobs (3ds/switch/nds) are taken verbatim
# from each client's own README "Building" section, which is the
# documented ground truth for a from-scratch machine, and have since been
# confirmed correct by a real green run.
#
# The devkitPro jobs retry their `dkp-pacman -Sy` package install: their
# base container images (devkitpro/devkitarm, devkitpro/devkita64) only
# ship the bare compiler toolchain, not libnx/libctru/libnds etc. -- those
# are always fetched live from pkg.devkitpro.org at job start, and that
# host is Cloudflare-fronted and occasionally answers a plain,
# non-authenticated CI runner request with a Cloudflare "Attention
# Required" 403 challenge page instead of the package (confirmed by hand:
# same command, same container, succeeded minutes later with zero code
# changes in between -- a transient block, not a wrong package name or a
# permanent one). devkitPro itself doesn't officially support pacman
# inside CI for exactly this reason (their own recommendation is to use
# the Docker images as-is); retrying a few times with a short delay is the
# standard community workaround, not a special bypass.
#
# On top of the retry, each devkitPro job now also caches dkp-pacman's own
# package-download cache dir (actions/cache, keyed on the exact package
# list) -- once a run successfully downloads everything, every later run
# restores from cache and never has to touch pkg.devkitpro.org again
# (dkp-pacman still checks/uses the cached .pkg.tar.* files without
# re-fetching them) unless a job's package list changes -- see
# "Locate dkp-pacman cache dir" in each job for how the actual directory is
# determined (queried from `dkp-pacman -v`'s own output, not guessed/
# hardcoded, since it's undocumented and this doesn't need to be guessed
# when pacman will just tell us).

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  capabilities:
    name: capability matrix lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_capabilities.py
      - run: python3 tools/check_button_mapping.py

  core:
    # Stage 2 of the CI plan: real functional tests (core/tests' ctest
    # suite -- protocol/deflate/inflate/websocket/video_encode/handshake),
    # not just "does it compile". Previously build-only
    # (-DFINLINK_BUILD_TESTS=OFF) per the stage-1 plan; flipped on once
    # test_handshake.c actually existed to run (it's the one covering
    # hello_ack/session_ready.video_mode, the "Video-mode fallback"
    # negotiation this whole feature is built on).
    name: core (build + ctest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S core -B build/core -DFINLINK_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/core -j"$(nproc)"
      - name: Test
        working-directory: build/core
        run: ctest --output-on-failure

  console-client-logic-tests:
    # Host-buildable logic tests for console-clients' non-SDK-coupled pieces
    # -- deliberately plain ubuntu-latest, not the devkitpro/devkita64/
    # devkitarm containers build-3ds/switch/nds below use: every file tested
    # here (screen_choice.c, audio_ring.c, audio_remix.{hpp,cpp}) is
    # deliberately kept free of any devkitPro-only headers specifically so
    # this doesn't need any cross-toolchain (or its Cloudflare-flaky
    # dkp-pacman install) at all. Does NOT exercise the real .3dsx/.nro/.nds
    # builds -- see build-3ds/switch/nds for that; this only proves the
    # extracted logic itself (dual-screen-client screen choice, dual-audio-
    # client remix/resample/ring-buffer) is correct.
    #
    # clients/3ds/tests and clients/nds/arm9/tests each build more than one
    # test binary from their tests/CMakeLists.txt (dual-screen-choice +
    # audio) -- one configure+build+ctest per client covers all of that
    # client's registered tests, nothing further to add here as more get
    # appended to those CMakeLists.txt files over time.
    name: console-client logic tests (3ds + nds + switch, host-built)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure + build + test (3DS)
        run: |
          cmake -S clients/3ds/tests -B build/3ds_logic_tests
          cmake --build build/3ds_logic_tests -j"$(nproc)"
      - name: Test (3DS)
        working-directory: build/3ds_logic_tests
        run: ctest --output-on-failure
      - name: Configure + build + test (NDS)
        run: |
          cmake -S clients/nds/arm9/tests -B build/nds_logic_tests
          cmake --build build/nds_logic_tests -j"$(nproc)"
      - name: Test (NDS)
        working-directory: build/nds_logic_tests
        run: ctest --output-on-failure
      - name: Configure + build + test (Switch)
        run: |
          cmake -S clients/switch/tests -B build/switch_logic_tests
          cmake --build build/switch_logic_tests -j"$(nproc)"
      - name: Test (Switch)
        working-directory: build/switch_logic_tests
        run: ctest --output-on-failure

  android:
    name: android (assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Provisions the SDK and accepts licenses; the NDK + CMake 3.22.1
      # externalNativeBuild pulls (see app/build.gradle.kts) are fetched by
      # AGP itself on first use, same as a fresh local checkout.
      - uses: android-actions/setup-android@v3
      - name: gradlew assembleDebug
        working-directory: clients/android
        run: ./gradlew :app:assembleDebug --stacktrace

  build-3ds:
    # Job id can't start with a digit (GitHub Actions schema rule) -- "3ds"
    # alone was rejected outright at parse time (zero jobs created, whole
    # workflow run failed in 0s), hence the "build-" prefix here even
    # though every other job id in this file is just the target name.
    name: 3ds (.3dsx)
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate dkp-pacman cache/DB dirs
        id: pacman_cache
        # `-Sy`'s failures in our logs are always the *database* sync
        # ("failed retrieving file 'dkp-linux.db'"), not a package
        # download -- so both the DB Path (the synced repo .db files) and
        # Cache Dirs (downloaded .pkg.tar.* files) need to survive between
        # runs for a cache hit to let a later run skip pkg.devkitpro.org
        # entirely. `pacman -Vv` turned out to just print the version
        # banner on devkitPro's fork (no config dump like stock Arch
        # pacman) -- fall back to `pacman-conf` if present, then to
        # grepping pacman.conf directly, since the config file itself
        # ships with the base image and doesn't need a successful sync to
        # exist.
        run: |
          dbpath=""
          cachedir=""
          if command -v pacman-conf >/dev/null 2>&1; then
            dbpath=$(pacman-conf DBPath 2>/dev/null || true)
            cachedir=$(pacman-conf CacheDir 2>/dev/null | head -1 || true)
          fi
          conf=$(find /opt/devkitpro -maxdepth 4 -iname "pacman.conf" 2>/dev/null | head -1)
          echo "pacman.conf: ${conf:-<not found>}"
          if [ -n "$conf" ]; then
            cat "$conf"
            [ -z "$dbpath" ] && dbpath=$(awk -F'= *' '/^ *DBPath/ {print $2}' "$conf")
            [ -z "$cachedir" ] && cachedir=$(awk -F'= *' '/^ *CacheDir/ {print $2}' "$conf")
          fi
          echo "Diagnostic tree under /opt/devkitpro/pacman (up to depth 5):"
          find /opt/devkitpro/pacman -maxdepth 5 -type d 2>/dev/null
          echo "Detected DB Path: '$dbpath', Cache Dirs: '$cachedir'"
          echo "dbpath=$dbpath" >> "$GITHUB_OUTPUT"
          echo "cachedir=$cachedir" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.pacman_cache.outputs.dbpath != '' && steps.pacman_cache.outputs.cachedir != ''
        with:
          path: |
            ${{ steps.pacman_cache.outputs.dbpath }}
            ${{ steps.pacman_cache.outputs.cachedir }}
          key: devkitpro-3ds-pkgcache-v1-libctru-citro2d-citro3d-3dstools-general-tools-3ds-cmake-devkitarm-cmake-3ds-pkg-config
      # Package list from clients/3ds/README.md "Building". Retried -- see
      # this file's own top comment on pkg.devkitpro.org's Cloudflare 403s.
      # Falls back to `-S` (install from whatever's cached, no forced
      # database refresh) if every `-Sy` attempt hit the block, so a cache
      # hit still lets the job succeed without pkg.devkitpro.org being
      # reachable at all -- a stale-by-a-few-days toolchain library list is
      # a much better failure mode than the job just not running.
      - name: Install 3DS dev packages
        run: |
          for i in 1 2 3 4 5; do
            dkp-pacman -Sy --noconfirm libctru citro2d citro3d 3dstools general-tools 3ds-cmake devkitarm-cmake 3ds-pkg-config && exit 0
            echo "dkp-pacman -Sy failed (attempt $i/5), retrying in 20s..."
            sleep 20
          done
          echo "All -Sy attempts failed -- falling back to -S (cached DB/packages, no refresh)"
          dkp-pacman -S --noconfirm libctru citro2d citro3d 3dstools general-tools 3ds-cmake devkitarm-cmake 3ds-pkg-config
      - name: Configure
        run: |
          cmake -S clients/3ds -B build/3ds \
            -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/3DS.cmake" \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/3ds -j"$(nproc)"

  switch:
    name: switch (.nro)
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate dkp-pacman cache/DB dirs
        id: pacman_cache
        # See the 3ds job's identical step for why both DB Path and Cache
        # Dirs need caching, why they're queried rather than guessed, and
        # why pacman-conf/pacman.conf are used instead of `pacman -Vv`
        # (just prints a version banner on devkitPro's fork).
        run: |
          dbpath=""
          cachedir=""
          if command -v pacman-conf >/dev/null 2>&1; then
            dbpath=$(pacman-conf DBPath 2>/dev/null || true)
            cachedir=$(pacman-conf CacheDir 2>/dev/null | head -1 || true)
          fi
          conf=$(find /opt/devkitpro -maxdepth 4 -iname "pacman.conf" 2>/dev/null | head -1)
          echo "pacman.conf: ${conf:-<not found>}"
          if [ -n "$conf" ]; then
            cat "$conf"
            [ -z "$dbpath" ] && dbpath=$(awk -F'= *' '/^ *DBPath/ {print $2}' "$conf")
            [ -z "$cachedir" ] && cachedir=$(awk -F'= *' '/^ *CacheDir/ {print $2}' "$conf")
          fi
          echo "Diagnostic tree under /opt/devkitpro/pacman (up to depth 5):"
          find /opt/devkitpro/pacman -maxdepth 5 -type d 2>/dev/null
          echo "Detected DB Path: '$dbpath', Cache Dirs: '$cachedir'"
          echo "dbpath=$dbpath" >> "$GITHUB_OUTPUT"
          echo "cachedir=$cachedir" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.pacman_cache.outputs.dbpath != '' && steps.pacman_cache.outputs.cachedir != ''
        with:
          path: |
            ${{ steps.pacman_cache.outputs.dbpath }}
            ${{ steps.pacman_cache.outputs.cachedir }}
          key: devkitpro-switch-pkgcache-v1-libnx-switch-glfw-switch-mesa-switch-libdrm_nouveau-switch-pkg-config-switch-zlib-switch-cmake-switch-tools-dkp-cmake-common-utils-dkp-toolchain-vars
      # Package list from clients/switch/README.md "Building". Retried --
      # see this file's own top comment on pkg.devkitpro.org's Cloudflare
      # 403s (this is the job that actually hit one, on a run that
      # otherwise changed nothing about this step). Falls back to `-S` --
      # see the 3ds job's identical fallback for why.
      - name: Install Switch dev packages
        run: |
          for i in 1 2 3 4 5; do
            dkp-pacman -Sy --noconfirm libnx switch-glfw switch-mesa switch-libdrm_nouveau switch-pkg-config switch-zlib switch-cmake switch-tools dkp-cmake-common-utils dkp-toolchain-vars && exit 0
            echo "dkp-pacman -Sy failed (attempt $i/5), retrying in 20s..."
            sleep 20
          done
          echo "All -Sy attempts failed -- falling back to -S (cached DB/packages, no refresh)"
          dkp-pacman -S --noconfirm libnx switch-glfw switch-mesa switch-libdrm_nouveau switch-pkg-config switch-zlib switch-cmake switch-tools dkp-cmake-common-utils dkp-toolchain-vars
      - name: Configure
        run: |
          cmake -S clients/switch -B build/switch \
            -DPLATFORM_SWITCH=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/switch --target finlink-switch.nro -j"$(nproc)"

  nds:
    name: nds (.nds, feasibility client)
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate dkp-pacman cache/DB dirs
        id: pacman_cache
        # See the 3ds job's identical step for why both DB Path and Cache
        # Dirs need caching, why they're queried rather than guessed, and
        # why pacman-conf/pacman.conf are used instead of `pacman -Vv`
        # (just prints a version banner on devkitPro's fork).
        run: |
          dbpath=""
          cachedir=""
          if command -v pacman-conf >/dev/null 2>&1; then
            dbpath=$(pacman-conf DBPath 2>/dev/null || true)
            cachedir=$(pacman-conf CacheDir 2>/dev/null | head -1 || true)
          fi
          conf=$(find /opt/devkitpro -maxdepth 4 -iname "pacman.conf" 2>/dev/null | head -1)
          echo "pacman.conf: ${conf:-<not found>}"
          if [ -n "$conf" ]; then
            cat "$conf"
            [ -z "$dbpath" ] && dbpath=$(awk -F'= *' '/^ *DBPath/ {print $2}' "$conf")
            [ -z "$cachedir" ] && cachedir=$(awk -F'= *' '/^ *CacheDir/ {print $2}' "$conf")
          fi
          echo "Diagnostic tree under /opt/devkitpro/pacman (up to depth 5):"
          find /opt/devkitpro/pacman -maxdepth 5 -type d 2>/dev/null
          echo "Detected DB Path: '$dbpath', Cache Dirs: '$cachedir'"
          echo "dbpath=$dbpath" >> "$GITHUB_OUTPUT"
          echo "cachedir=$cachedir" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.pacman_cache.outputs.dbpath != '' && steps.pacman_cache.outputs.cachedir != ''
        with:
          path: |
            ${{ steps.pacman_cache.outputs.dbpath }}
            ${{ steps.pacman_cache.outputs.cachedir }}
          key: devkitpro-nds-pkgcache-v1-libnds-dswifi-maxmod-nds-calico-general-tools
      # Package list from clients/nds/README.md "Building" (same devkitARM
      # toolchain as the 3ds job, different libs -- ndstool itself ships in
      # general-tools alongside 3dstool). Retried -- see this file's own
      # top comment on pkg.devkitpro.org's Cloudflare 403s. Falls back to
      # `-S` -- see the 3ds job's identical fallback for why.
      - name: Install NDS dev packages
        run: |
          for i in 1 2 3 4 5; do
            dkp-pacman -Sy --noconfirm libnds dswifi maxmod-nds calico general-tools && exit 0
            echo "dkp-pacman -Sy failed (attempt $i/5), retrying in 20s..."
            sleep 20
          done
          echo "All -Sy attempts failed -- falling back to -S (cached DB/packages, no refresh)"
          dkp-pacman -S --noconfirm libnds dswifi maxmod-nds calico general-tools
      - name: Build (classic two-ELF Makefile, no CMake -- see clients/nds/README.md)
        working-directory: clients/nds
        run: make

  web:
    name: web (wasm bridge + bridge_test.mjs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # clients/web/build_wasm.sh only requires emsdk to exist at this
      # exact path, not that it's a registered git submodule (the repo
      # doesn't actually have one registered yet, see the script's own
      # comment) -- a plain clone satisfies it without touching
      # .gitmodules from CI.
      - name: Fetch emsdk
        run: git clone --depth 1 https://github.com/emscripten-core/emsdk.git clients/web/emsdk
      - name: Build wasm bridge + run bridge_test.mjs
        run: clients/web/build_wasm.sh
